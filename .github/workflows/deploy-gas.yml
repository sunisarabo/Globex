# Auto-deploy to Google Apps Script via clasp
#
# One-time setup (see DEPLOYMENT.md §6):
#   1. Enable the Apps Script API: https://script.google.com/home/usersettings
#   2. On your machine: npm i -g @google/clasp && clasp login
#   3. Repo Settings → Secrets and variables → Actions → add:
#        CLASPRC_JSON      = contents of ~/.clasprc.json (from step 2)
#        GAS_SCRIPT_ID     = Apps Script project id (Project Settings → Script ID)
#        GAS_DEPLOYMENT_ID = (optional) web-app deployment id — when set, each
#                            push also publishes a new version to the SAME /exec URL
name: Deploy to Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  push-to-gas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$GAS_SCRIPT_ID" ]; then
            echo "::error::Missing CLASPRC_JSON or GAS_SCRIPT_ID secret — see DEPLOYMENT.md §6"
            exit 1
          fi
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          # scriptId comes from the secret so the repo never hardcodes a project
          printf '{"scriptId":"%s","rootDir":"."}\n' "$GAS_SCRIPT_ID" > .clasp.json

      - name: Push code (Code.gs, Index.html, appsscript.json per .claspignore)
        run: clasp push -f

      - name: Publish new version to existing web-app URL
        if: ${{ vars.SKIP_GAS_DEPLOY != 'true' }}
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          if [ -z "$GAS_DEPLOYMENT_ID" ]; then
            echo "GAS_DEPLOYMENT_ID not set — code pushed only; publish a version manually (Deploy → Manage deployments → New version)"
            exit 0
          fi
          clasp deploy -i "$GAS_DEPLOYMENT_ID" -d "auto ${GITHUB_SHA::7}"
