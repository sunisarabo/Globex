function renderFlightCard(f) {
  var sla = getSLA(f.airline);
  var tl = computeTL(f);
  var key = f.team+'-'+state.date+'-'+f.id;
  var fa = state.assignments[key]||{};
  var asn = 0;
  Object.keys(fa).forEach(function(r){asn += (fa[r]||[]).filter(function(x){return x;}).length;});
  var pct = sla.total?asn/sla.total*100:0;
  var cls = pct>=100?'ok':pct>=50?'warn':'bad';
  var tlBar = '';
  if (tl) {
    var range = tl.post-tl.brief;
    var seg = function(s,e,c,l){var ll=((s-tl.brief)/range)*100,ww=((e-s)/range)*100;return '<div class="tl-seg '+c+'" style="left:'+ll.toFixed(1)+'%;width:'+ww.toFixed(1)+'%">'+(ww>8?l:'')+'</div>';};
    tlBar = '<div class="tlbar">'+seg(tl.brief,tl.open,'tl-brief','Brief')+seg(tl.open,tl.close,'tl-ci','CI')+seg(tl.gate,tl.std,'tl-gate','Gate')+seg(tl.std,tl.post,'tl-post','Post')+'</div>';
  }
  // Helper: extract role code & label from tuple (supports 2-tuple legacy + 4-tuple new)
  function rTup(r){return {label:r[0], cnt:r[1], code:(r.length>=3?r[2]:r[0]), area:(r.length>=4?r[3]:'')};}
  return '<div class="fc">'+
    '<div class="fc-hdr"><span class="fc-num">'+esc(f.flight_no)+'</span>'+
    '<span class="badge badge-brand">'+esc(f.airline)+'</span>'+
    '<span class="badge">'+esc(f.team)+'</span>'+
    '<span class="fc-time">'+esc(f.dep_time)+' · '+esc(f.from)+'→'+esc(f.to)+'</span>'+
    '<span class="fc-time">'+esc(f.aircraft||'')+' · '+esc(f.bay||'')+' / '+esc(f.gate||'')+'</span>'+
    '<span class="fc-stat '+cls+'">'+asn+'/'+sla.total+'</span></div>'+
    tlBar+

window.pickSlot = function(k, r, i){
  var parts = k.split('-');
  var team = parts[0];
  var fid = parseInt(parts[parts.length-1]);
  var f = state.flights.find(function(x){return x.id===fid;});

  var dcs = airlineDCS(airline);
  var date = f ? f.flight_date : state.date;
  var roleCode = r;
  var pool = state.staff.filter(function(s){return s.active&&['SUP','SNR','PSA'].indexOf(s.p)>=0;}).map(function(s){
    return Object.assign({}, s, {_score: skillScore(s, airline)});
  }).sort(function(a,b){
    // 1) home team first, 2) skill match (DCS then language), 3) checked-in, 4) SUP→SNR→PSA, 5) name
    var ha = a.t===team?0:1, hb = b.t===team?0:1;
    if (ha !== hb) return ha - hb;
    if (a._score !== b._score) return b._score - a._score;
    var ca = getCheckIn(date, a.i)?0:1, cb = getCheckIn(date, b.i)?0:1;
    if (ca !== cb) return ca - cb;
    var pa = POS_RANK[a.p]!=null?POS_RANK[a.p]:99, pb = POS_RANK[b.p]!=null?POS_RANK[b.p]:99;
    if (pa !== pb) return pa - pb;
    return a.n < b.n ? -1 : a.n > b.n ? 1 : 0;
  });

  // Code dropdown: list all 56 master codes for free assignment
  var allCodes = ROLE_DEFS.map(function(r){return r[0];});

  var fa = state.assignments[k] || {};

  Object.keys(fa).forEach(function(rc){(fa[rc]||[]).forEach(function(sid){if(sid){if(!personRoles[sid])personRoles[sid]=[];personRoles[sid].push(rc);}});});

  var html = '<div class="modal on" onclick="if(event.target===this)this.remove()"><div class="modal-box" style="max-width:680px;display:flex;flex-direction:column;max-height:85vh">'+

      '<select id="pickCode" class="select" style="width:auto;font-family:var(--mono);font-weight:700">'+codeOptions+'</select>'+
      '<span style="color:var(--sub);font-size:11px;margin-left:auto">💡 1 คนทำได้หลาย code · ✓ DCS match แสดงเป็นสีเขียว</span>'+
    '</div>'+
    '<input class="input" placeholder="🔍 Search by name / ID / skill..." style="margin-bottom:8px" oninput="document.querySelectorAll(\'#picklist .api\').forEach(function(el){el.style.display=el.dataset.q.indexOf(this.value.toLowerCase())>=0?\'\':\'none\';},this)">'+
    '<div id="picklist" style="overflow-y:auto;flex:1">'+pool.map(function(s){
      var cross = s.t!==team;
      var hasDcs = (s.sk||[]).indexOf(dcs) >= 0;
      var ci = getCheckIn(date, s.i);
      var ciBadge = ci ? '<span class="badge badge-green" style="font-size:9px" title="Checked in '+esc(ci.at)+'">✅ '+esc(ci.at)+'</span>' : '<span style="font-size:9px;color:var(--sub)">⏳ pending</span>';
      var dcsBadge = hasDcs ? '<span class="badge" style="background:'+DCS_COLORS[dcs]+'15;color:'+DCS_COLORS[dcs]+';border:1px solid '+DCS_COLORS[dcs]+';font-size:9px">'+esc(dcs)+'</span>' : '';
      var langs = (s.sk||[]).filter(function(x){return ['EN','CN','KR','JP','AR','RU'].indexOf(x)>=0;}).join(' ');
      var langBadge = langs ? '<span style="font-size:9px;color:var(--sub)" title="Languages">🌐 '+esc(langs)+'</span>' : '';
      var alreadyRoles = personRoles[s.i];
      var multiBadge = alreadyRoles ? '<span class="badge badge-amber" style="font-size:9px;margin-left:4px" title="Already on this flight">+'+alreadyRoles.length+': '+esc(alreadyRoles.join(','))+'</span>' : '';
      var bgHint = hasDcs ? 'background:#dcfce715;' : '';
      return '<div class="api" data-q="'+esc((s.n+' '+s.ln+' '+s.i+' '+(s.sk||[]).join(' ')).toLowerCase())+'" onclick="confirmPick(\''+k+'\',document.getElementById(\'pickCode\').value,'+i+',\''+s.i+'\');this.closest(\'.modal\').remove()" style="display:flex;gap:8px;padding:8px;border-radius:6px;cursor:pointer;align-items:center;'+bgHint+'border:1px solid var(--line);margin-bottom:3px" onmouseover="this.style.background=\'var(--hover)\'" onmouseout="this.style.background=\''+(hasDcs?'#dcfce715':'')+'\'">'+

window.rpToggle = function(btn){
  var grid = document.getElementById('rpGrid'); if (!grid) return;
  var k = grid.getAttribute('data-k'), sid = grid.getAttribute('data-sid');
  var code = btn.getAttribute('data-code');
  toggleRole(k, sid, code);
  var on = btn.getAttribute('data-on') === '1';
  btn.setAttribute('data-on', on ? '0' : '1');
  if (on){
    btn.style.background = '#fff'; btn.style.color = btn.getAttribute('data-off'); btn.style.outline = 'none';
  } else {
    btn.style.background = btn.getAttribute('data-bg'); btn.style.color = btn.getAttribute('data-fg');
    btn.style.outline = '2px solid ' + btn.getAttribute('data-fg');
    try {
      var d = JSON.parse(localStorage.getItem('rp_recent')||'{}');
      var codes = (d.day===state.date ? d.codes : []) || [];
      codes = [code].concat(codes.filter(function(x){return x!==code;})).slice(0,5);
      localStorage.setItem('rp_recent', JSON.stringify({day:state.date, codes:codes}));
    } catch(e){}
  }
};

  var fltHeaders = flights.map(function(f){
    var sop = getSOP(f.airline);
    var tlh = computeTL(f);

/* ── Cross-team Support Finder ──────────────────────────────────────
   Pick a flight with role gaps → list staff from OTHER teams who are
   position-eligible (AR_RULES), on a working shift that covers the
   flight window, and not already busy on an overlapping flight. */
function arShiftWindow(staffId, team, date){
  var bk = team+'-'+date+'-'+staffId;
  var info = lookupShift(state.roster[bk]);
  if (!info || info.kind !== 'WORK') return null;
  var si = pt(info.in), so = pt(info.out);
  if (si==null || so==null) return null;
  if (so <= si) so += 1440;            // overnight shift
  // Per-day OT recorded in the roster (separate from the base shift):
  // hours before clock-in and after clock-out. null = not set (fall back
  // to the generic OT_EXT_MIN); a number (incl. 0) = authoritative.
  function otMin(suffix){
    var v = state.roster[bk+suffix];
    if (v==null || v==='') return null;
    var n = parseFloat(v); return isNaN(n) ? null : Math.max(0,n)*60;
  }
  return {s:si, e:so, code:state.roster[bk], hrs:info.hrs, otb:otMin('|OTB'), ota:otMin('|OTA')};
}
function arBusyWindows(staffId, date, excludeFid){
  var out = [];
  state.flights.forEach(function(f){
    if (f.flight_date !== date || f.id === excludeFid) return;
    var fa = state.assignments[f.team+'-'+date+'-'+f.id] || {};
    var on = Object.keys(fa).some(function(r){return (fa[r]||[]).indexOf(staffId) >= 0;});
    if (!on) return;
    var tl = computeTL(f); if (!tl) return;
    out.push({s:tl.brief, e:tl.post, flt:f.flight_no});
  });
  return out;
}

        '<span style="font-size:11px;color:var(--sub)">('+g.have+'/'+g.need+' · ลำดับ '+rolePosOrder(g.code).join('→')+')</span></div>'+
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>NAME</th><th>TEAM</th><th>POS</th><th>SHIFT</th><th>COVER</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';

function renderRoster() {
  var team = state.team==='ALL'?'EK':state.team;
  var d = new Date(state.date), y = d.getFullYear(), m = d.getMonth(), days = new Date(y,m+1,0).getDate();
  var staff = sortStaff(getStaffByTeam(team));   // SUP→SNR→PSA
  // Aggregate team OT + check weekly violations
  var teamTotal = 0, teamOT = 0, teamOTHours = 0, teamViolations = 0, teamWarns = 0, team48Exceed = 0;
  var staffOT = {};
  staff.forEach(function(s){
    var w = weekStats(s.i, team, state.date);
    teamTotal += w.total; teamOT += w.otShifts; teamOTHours += w.otHours;
    var summary = staffOTSummary(s.i, team, state.date);
    staffOT[s.i] = summary;
    teamViolations += summary.violations;
    team48Exceed += summary.exceeds48;
    if (summary.violations === 0 && summary.warns > 0) teamWarns++;
  });
  var staffWithViolation = Object.values(staffOT).filter(function(o){return o.violations>0;}).length;
  var staffWith48 = Object.values(staffOT).filter(function(o){return o.exceeds48>0;}).length;
  // Top alert: combined OT (>36) + total weekly hours (>48)
  var alertBanner = '';
  if (teamViolations > 0 || team48Exceed > 0){
    var msg = [];
    if (teamViolations > 0) msg.push(staffWithViolation+' staff OT > 36h/wk ('+teamViolations+' weeks)');
    if (team48Exceed > 0) msg.push(staffWith48+' staff total > 48h/wk ('+team48Exceed+' weeks)');
    alertBanner = '<div style="background:#fee2e2;border:1px solid #dc2626;color:#991b1b;padding:10px 12px;border-radius:6px;margin-bottom:10px;font-size:12px">'+
      '<b>⚠ Thai Labor Law Alert:</b> '+msg.join(' · ')+'<br>'+
      '<span style="font-size:11px">มาตรา 26 พรบ.คุ้มครองแรงงาน: OT ≤ 36 ชม./สัปดาห์ · งานปกติ ≤ 48 ชม./สัปดาห์</span>'+

    var statusBadges = [];

      (summary.violations>0 ?

       : summary.warns>0 ?
        '<b style="color:#92400e">⚠ Near limit — '+summary.warns+' weeks at 30-36 hrs OT</b><br><span style="color:#92400e">ใกล้ขีดจำกัด OT 36 ชม./สัปดาห์</span>'

    '</div>'+
    '<div class="tbl-wrap" style="border:none"><table class="tbl">'+
      '<thead><tr><th>Week</th><th>Start (Mon)</th><th style="text-align:right">Work Days</th><th style="text-align:right">Total Hrs</th><th style="text-align:right">OT Hrs</th><th>Status</th></tr></thead>'+

// Save the per-day OT-before / OT-after fields (separate roster keys so
// they never disturb the base shift code parsing). Empty = clear.
window.saveRosterOT = function(k){
  function set(suffix, val){
    var v = String(val==null?'':val).trim();
    if (v==='' || parseFloat(v)===0 || isNaN(parseFloat(v))) delete state.roster[k+suffix];
    else state.roster[k+suffix] = String(Math.max(0, parseFloat(v)));
  }
  var ob = document.getElementById('otbInp'), oa = document.getElementById('otaInp');
  set('|OTB', ob && ob.value);
  set('|OTA', oa && oa.value);
  lsSave();
  var m = document.querySelector('.modal'); if (m) m.remove();
  render();
  toast('บันทึก OT แล้ว');
};
window.rosterFill = function(){var team=state.team==='ALL'?'EK':state.team;var d=new Date(state.date),y=d.getFullYear(),m=d.getMonth(),days=new Date(y,m+1,0).getDate();var WORK=['G12','G10','H10','H12'];var n=0;getStaffByTeam(team).forEach(function(s,idx){var off=idx%6;for(var d=1;d<=days;d++){var slot=(d+off)%6;var code=slot<4?WORK[slot]:'OFF';var k=team+'-'+y+'-'+p2(m+1)+'-'+p2(d)+'-'+s.i;if(!state.roster[k]){state.roster[k]=code;n++;}}});lsSave();toast('Filled '+n+' cells');render();};

// Pull the REAL monthly roster from the Drive source file (server parses
// the grid + maps employee-id → team via the staff master) and merge it
// into state.roster, overwriting synthetic codes. In-memory + lsSave;
// independent of the (currently failing) roster-save path.
window.importRosterDrive = async function(force){
  if (force && !confirm('Replace from Drive จะ "ทับ" กะที่มีอยู่/แก้ manual ไว้ ด้วยข้อมูลจากไฟล์ Roster จริงทั้งหมด — ยืนยัน?')) return;
  toast(force?'กำลังดึงทับจาก Drive…':'กำลังอ่าน Roster จริงจาก Drive…');
  try {
    var d = await gsRun('importRosterFromDrive', {});
    if (!d || d.error) throw new Error(d && d.error ? d.error : 'no response');
    var cells = d.cells || [], n = 0, skipped = 0, replaced = 0;
    cells.forEach(function(c){
      if (!c || !c.key) return;
      if (state.roster[c.key]){
        if (!force){ skipped++; return; }     // non-destructive: keep existing
        if (state.roster[c.key] !== c.code) replaced++;
      }
      state.roster[c.key] = c.code; n++;
    });
    lsSave();
    render();
    toast((force?'ทับ '+replaced+' · ':'')+'นำเข้า '+n+' กะ'+(force?'':'ใหม่')+
          (force?'':' · ข้ามของเดิม '+skipped)+' · staff ตรง '+d.staffMatched+
          ' · id ไม่ตรง '+d.unmatched+(d.sheets&&d.sheets.length?(' · '+d.sheets.length+' แท็บ'):''));
  } catch(e){
    toast('Import ล้มเหลว: '+e.message);
  }
};

window.rosterBulkApply = function(team, y, m){
  var from = Math.max(1, parseInt(document.getElementById('bkFrom').value)||1);
  var to   = Math.min(31, parseInt(document.getElementById('bkTo').value)||from);
  if (to < from){ toast('ช่วงวันที่ไม่ถูกต้อง'); return; }
  var mode = document.getElementById('bkMode').value;
  var staff = getStaffByTeam(team);
  if (!staff.length){ toast('ไม่มีพนักงานในทีม '+team); return; }
  var verb = mode==='clear'?'เคลียร์':'ตั้งโค้ด';
  if (!confirm(verb+' วันที่ '+from+'–'+to+' ('+(to-from+1)+' วัน) × '+staff.length+' คน ทีม '+team+' — ยืนยัน?')) return;
  var code, otb, ota;
  if (mode==='set'){
    code = document.getElementById('bkCode').value;
    otb = (document.getElementById('bkOTB').value||'').trim();
    ota = (document.getElementById('bkOTA').value||'').trim();
  }
  var n=0;
  staff.forEach(function(s){
    for (var d=from; d<=to; d++){
      var k = team+'-'+y+'-'+p2(m+1)+'-'+p2(d)+'-'+s.i;
      if (mode==='clear'){
        if (state.roster[k]!=null){ delete state.roster[k]; n++; }
        delete state.roster[k+'|OTB']; delete state.roster[k+'|OTA'];
      } else {
        state.roster[k] = code; n++;
        if (otb && parseFloat(otb)>0) state.roster[k+'|OTB']=String(parseFloat(otb)); else delete state.roster[k+'|OTB'];
        if (ota && parseFloat(ota)>0) state.roster[k+'|OTA']=String(parseFloat(ota)); else delete state.roster[k+'|OTA'];
      }
    }
  });
  lsSave();
  var mdl=document.querySelector('.modal'); if(mdl) mdl.remove();
  render();
  toast((mode==='clear'?'เคลียร์ ':'ตั้งโค้ด ')+n+' เซลล์ · ทีม '+team);
};

window.importLL = async function(force){
  toast('กำลังอ่านไฟล์ LL จาก Drive…');
  try {
    var d = await gsRun('importLLFromDrive', {});
    if (!d || d.error) throw new Error(d && d.error ? d.error : 'no response');
    var byId = {}; state.staff.forEach(function(s){ byId[s.i]=s; });
    var added = 0;
    (d.staff||[]).forEach(function(s){
      if (byId[s.i]) { byId[s.i].p = s.p||byId[s.i].p; return; }
      state.staff.push({ i:s.i, n:s.n||s.i, ln:'', nth:'', lnth:'', p:s.p||'PSA', t:'LL', title:'', active:true, sk:[] });
      added++;
    });
    var n=0, skipped=0;
    (d.cells||[]).forEach(function(c){
      if (!c || !c.key) return;
      if (state.roster[c.key] && !force){ skipped++; return; }
      state.roster[c.key]=c.code; n++;
    });
    lsSave(); render();
    toast('LL: พนักงานใหม่ '+added+' · กะ '+n+(force?'':' (ข้ามของเดิม '+skipped+')')+
          ' · '+(d.days?d.days.length:0)+' วัน · รวม '+d.staffCount+' คน');
  } catch(e){
    toast('Import LL ล้มเหลว: '+e.message);
  }
};

function renderReports() {
  var d = new Date(state.date), y = d.getFullYear(), m = d.getMonth();
  var days = new Date(y, m+1, 0).getDate();
  var monthLabel = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]+' '+y;
  var staff = state.staff.filter(function(s){return s.active && inDept(s);});

  // Aggregate stats per staff for the month
  var rows = staff.map(function(s){
    var w = weekStats(s.i, s.t, state.date);
    var otSummary = staffOTSummary(s.i, s.t, state.date);
    var assignedCnt = 0;
    Object.keys(state.assignments).forEach(function(k){
      if (k.indexOf('-'+y+'-'+p2(m+1)+'-') < 0) return;
      var fa = state.assignments[k] || {};
      Object.keys(fa).forEach(function(r){
        if ((fa[r]||[]).indexOf(s.i) >= 0) assignedCnt++;
      });
    });
    return {s:s, total:w.total, ot:w.otShifts, otHrs:w.otHours, off:w.offDays, leave:w.leaveDays, work:w.workDays, asn:assignedCnt, maxWkOT:otSummary.maxOT, violations:otSummary.violations};
  });
  rows.sort(function(a,b){
    // Violations bubble to top
    if ((a.violations>0) !== (b.violations>0)) return a.violations>0 ? -1 : 1;
    var pa = POS_RANK[a.s.p]||99, pb = POS_RANK[b.s.p]||99;
    if (pa!==pb) return pa-pb;
    if (a.s.t !== b.s.t) return a.s.t<b.s.t?-1:1;
    return b.total - a.total;
  });
  var totalViolations = rows.reduce(function(a,b){return a+b.violations;}, 0);
  var staffWithViolation = rows.filter(function(r){return r.violations>0;}).length;

  // Team summary
  var teamSum = {};
  rows.forEach(function(r){
    var t = r.s.t;
    if (!teamSum[t]) teamSum[t] = {n:0, total:0, ot:0, asn:0};
    teamSum[t].n++; teamSum[t].total += r.total; teamSum[t].ot += r.ot; teamSum[t].asn += r.asn;
  });

  var totalHrs = rows.reduce(function(a,b){return a+b.total;}, 0);
  var totalOt = rows.reduce(function(a,b){return a+b.ot;}, 0);
  var totalAsn = rows.reduce(function(a,b){return a+b.asn;}, 0);

  // Check-in stats
  var ciStats = {today:0, week:0};
  Object.keys(state.checkin || {}).forEach(function(k){
    var dt = k.split('|')[0];
    if (dt === state.date) ciStats.today++;
    var checkDate = new Date(dt);
    var diff = (Date.now() - checkDate.getTime()) / 86400000;
    if (diff <= 7) ciStats.week++;
  });

  return `
    <div class="phdr">
      <div><h2>📈 Reports</h2><div class="sub">Working hours · OT · attendance · coverage — ${monthLabel}</div></div>
      <div style="display:flex;gap:8px">
        <input type="date" class="input" value="${state.date}" onchange="setDate(this.value);" style="width:auto">
        <button class="btn btn-primary btn-sm" onclick="exportReportCSV()">📥 Export CSV</button>
        <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨 Print</button>
      </div>
    </div>
    ${totalViolations>0 ? '<div style="background:#fee2e2;border:1px solid #dc2626;color:#991b1b;padding:10px 12px;border-radius:6px;margin-bottom:10px;font-size:12px"><b>⛔ Thai Labor Law Compliance Alert:</b> '+staffWithViolation+' staff มี OT > 36 ชม./สัปดาห์ ('+totalViolations+' weeks total) — ต้องแก้ไข roster ก่อนสรุปจ่ายเงินเดือน</div>' : ''}
    <div class="kpi" style="margin-bottom:14px">
      <div class="kpi-card"><div class="lbl">Active Staff</div><div class="val">${staff.length}</div><div class="sub">${state.dept==='ALL'?'ทุกแผนก':DEPT_LABELS[state.dept]}</div></div>
      <div class="kpi-card k-blue"><div class="lbl">Total Hours</div><div class="val">${totalHrs}</div><div class="sub">/ ${monthLabel}</div></div>
      <div class="kpi-card k-amber"><div class="lbl">OT Shifts</div><div class="val">${totalOt}</div><div class="sub">>8 hrs/shift</div></div>
      <div class="kpi-card ${totalViolations>0?'k-red':'k-green'}"><div class="lbl">⚖ OT Compliance</div><div class="val">${totalViolations>0?'⛔ '+totalViolations:'✓ OK'}</div><div class="sub">${totalViolations>0?staffWithViolation+' staff > 36h/wk':'all weeks ≤ 36h OT'}</div></div>
    </div>

    <!-- Team Summary -->
    <div class="card" style="margin-bottom:14px">
      <h3 style="font-size:14px;margin-bottom:10px">Team Summary — ${monthLabel}</h3>
      <div class="tbl-wrap" style="border:none"><table class="tbl">
        <thead><tr><th>Team</th><th>Description</th><th style="text-align:right">Staff</th><th style="text-align:right">Total Hrs</th><th style="text-align:right">Avg/staff</th><th style="text-align:right">OT Shifts</th><th style="text-align:right">Assignments</th></tr></thead>
        <tbody>${Object.keys(teamSum).sort().map(function(t){
          var ts = teamSum[t];
          var avg = ts.n ? Math.round(ts.total/ts.n) : 0;
          var avgCls = avg>=200?'hrs-ot':avg>=160?'hrs-warn':'';
          return '<tr><td><span class="badge badge-brand">'+esc(t)+'</span></td><td style="color:var(--sub)">'+esc(TEAM_LABELS[t]||t)+'</td><td style="text-align:right">'+ts.n+'</td><td style="text-align:right">'+ts.total+'h</td><td style="text-align:right;'+(avgCls?'color:#dc2626;font-weight:700':'')+'">'+avg+'h</td><td style="text-align:right">'+ts.ot+'</td><td style="text-align:right">'+ts.asn+'</td></tr>';
        }).join('')}</tbody>
      </table></div>
    </div>

    <!-- Per-staff breakdown -->
    <div class="card">
      <h3 style="font-size:14px;margin-bottom:10px">Staff Hours & OT Detail (${rows.length} staff) <span style="font-size:11px;color:var(--sub);font-weight:400">— violations sorted to top</span></h3>
      <div class="tbl-wrap" style="max-height:60vh"><table class="tbl">
        <thead><tr><th>#</th><th>Pos</th><th>Name</th><th>ID</th><th>Team</th><th style="text-align:right">Work</th><th style="text-align:right">Off</th><th style="text-align:right">Leave</th><th style="text-align:right">Total Hrs</th><th style="text-align:right">OT Hrs</th><th style="text-align:right" title="Maximum OT in any single week">Wk OT Max</th><th style="text-align:center">⚖ Compliance</th><th style="text-align:right">Assignments</th></tr></thead>
        <tbody>${rows.map(function(r,i){
          var hrCls = r.total>=200?'hrs-ot':r.total>=160?'hrs-warn':'';
          var wkCls = r.maxWkOT>36?'hrs-ot':r.maxWkOT>30?'hrs-warn':'';
          var posCls = r.s.p==='SUP'?'badge-red':r.s.p==='SNR'?'badge-green':'badge-blue';
          var compl = r.violations>0 ? '<span class="badge badge-red" title="'+r.violations+' weeks > 36h OT">⛔ '+r.violations+'wk</span>'
                    : r.maxWkOT>30 ? '<span class="badge badge-amber">⚠ Near</span>'
                    : '<span class="badge badge-green">✓</span>';
          var rowStyle = r.violations>0 ? 'background:#fef2f2' : '';
          return '<tr style="'+rowStyle+'" onclick="state.team=\''+r.s.t+'\';state.view=\'roster\';showOTBreakdown(\''+r.s.i+'\')" style="cursor:pointer"><td>'+(i+1)+'</td><td><span class="badge '+posCls+'">'+esc(r.s.p)+'</span></td><td><b>'+esc(r.s.n)+'</b> '+esc(r.s.ln)+'</td><td class="mono" style="font-size:10px">'+esc(r.s.i)+'</td><td><span class="badge badge-brand">'+esc(r.s.t)+'</span></td><td style="text-align:right">'+r.work+'</td><td style="text-align:right">'+r.off+'</td><td style="text-align:right">'+r.leave+'</td><td style="text-align:right;'+(hrCls?'color:#dc2626;font-weight:700':'')+'">'+r.total+'h</td><td style="text-align:right">'+(r.otHrs?r.otHrs+'h':'')+'</td><td style="text-align:right;'+(wkCls?'color:#dc2626;font-weight:700':'')+'">'+(r.maxWkOT?r.maxWkOT+'h':'')+'</td><td style="text-align:center">'+compl+'</td><td style="text-align:right">'+r.asn+'</td></tr>';
        }).join('')}</tbody>
      </table></div>
      <div style="font-size:11px;color:var(--sub);margin-top:10px;line-height:1.5">
        <b>⚖ OT Compliance:</b> ✓ = OK · ⚠ Near = 30-36h OT/week · ⛔ = >36h OT/week (violation of มาตรา 26 พรบ.คุ้มครองแรงงาน)<br>
        <b>OT calculation:</b> per shift hours beyond 8 (e.g., G12 shift = 12h work = 4h OT) · click row to see weekly breakdown
      </div>
    </div>`;
}

window.exportReportCSV = function(){
  var d = new Date(state.date), y = d.getFullYear(), m = d.getMonth();
  var staff = state.staff.filter(function(s){return s.active && inDept(s);});
  var rows = [['Pos','Name','Surname','EmpID','Team','WorkDays','OffDays','LeaveDays','TotalHrs','OTShifts']];
  staff.forEach(function(s){
    var w = weekStats(s.i, s.t, state.date);
    rows.push([s.p, s.n, s.ln, s.i, s.t, w.workDays, w.offDays, w.leaveDays, w.total, w.otShifts]);
  });
  var csv = rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'PSA-HKT-Report-'+y+'-'+p2(m+1)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('CSV downloaded');
};

  };

window.importBackup = function(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var d = JSON.parse(e.target.result);
      if (!confirm('Restore from '+(d.exported_at||'unknown date')+'? \n\nStaff: '+(d.staff||[]).length+' · Flights: '+(d.flights||[]).length+' · Roster: '+Object.keys(d.roster||{}).length+' cells\n\nThis will replace current data.')) return;
      if (d.staff) state.staff = d.staff;
      if (d.flights) state.flights = d.flights;
      if (d.assignments) state.assignments = d.assignments;
      if (d.roster) state.roster = d.roster;
      if (d.checkin) state.checkin = d.checkin;
      if (d.swaps) state.swaps = d.swaps;
      lsSave(); render();
      toast('Backup restored ✓');
    } catch(err){ alert('Import failed: '+err.message); }
  };
  reader.readAsText(file);
};

window.syncFromDrive = async function(){
  var input = document.getElementById('driveSyncUrl');
  var url = (input ? input.value.trim() : '') || state.driveSyncUrl;
  if (!url) { alert('กรุณาใส่ URL ก่อน — สามารถใช้ได้ทั้ง Apps Script Web App URL หรือ Google Sheets Publish-to-web CSV URL'); return; }
  state.driveSyncUrl = url;
  toast('🔄 Syncing...');
  try {
    var resp = await fetch(url, {redirect:'follow'});
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    var text = await resp.text();
    var flights = null;
    // Detect format: JSON (Apps Script) or CSV (Publish-to-web)
    var trimmed = text.trim();
    if (trimmed.startsWith('{') || trimmed.startsWith('[')){
      var data = JSON.parse(text);
      if (data.error) throw new Error(data.error);
      // Apps Script convention: {flights: [...]} or array
      var arr = Array.isArray(data) ? data : (data.flights || data.rows || data.data || []);
      if (Array.isArray(arr) && arr.length){
        // If items are already flight objects (have flight_no), use directly
        if (arr[0].flight_no || arr[0].flight_date){
          flights = arr.map(function(f, i){return Object.assign({bay:'B'+(i+1),gate:'G'+((i%14)+1),aircraft:'A320',pax:200}, f, {id:i+1});});
        } else {
          // Treat as rows[] where rows[0] is header
          flights = rowsToFlights([Object.keys(arr[0])].concat(arr.map(function(o){return Object.values(o);})));
        }
      }
    } else {
      var rows = parseCSV(text);
      if (!rows.length) throw new Error('CSV ว่างหรือ format ไม่ถูก');
      flights = rowsToFlights(rows);
    }
    if (!flights || !flights.length) throw new Error('แปลงเป็น flights ไม่สำเร็จ — column header ต้องมี: Date Airlines FLT.No Routing STA STD');
    state.flights = flights;
    state.driveLastSync = new Date().toISOString();
    state.driveLastCount = flights.length;
    lsSave(); render();
    toast('✅ Synced '+flights.length+' flights');
  } catch(e) {
    alert('❌ Sync failed: '+e.message+'\n\nตรวจสอบ:\n• URL ถูกต้องและ deploy แล้ว\n• ถ้าใช้ Apps Script: setting "Execute as: Me" + "Who has access: Anyone"\n• Token ใน URL ตรงกับใน Apps Script\n• Network ปกติ');
  }
};

/* Generic CSV parser (handles quoted fields with commas + escaped quotes) */
function parseCSV(text){
  var rows = [];
  var cur = [], field = '', inQ = false;
  for (var i=0; i<text.length; i++){
    var c = text[i], n = text[i+1];
    if (inQ){
      if (c === '"' && n === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQ = false; }
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ','){ cur.push(field); field = ''; }
      else if (c === '\n' || c === '\r'){
        if (c === '\r' && n === '\n') i++;
        cur.push(field); rows.push(cur); cur = []; field = '';
      } else field += c;
    }
  }
  if (field.length || cur.length){ cur.push(field); rows.push(cur); }
  return rows.filter(function(r){return r.some(function(c){return String(c).trim();});});
}

/* Convert generic CSV rows into flight objects (auto-detect columns) */
function rowsToFlights(rows){
  if (rows.length < 2) return [];
  var headers = rows[0].map(function(h){return String(h||'').trim();});
  function hIdx(patterns){
    for (var i=0; i<headers.length; i++){
      var h = headers[i].toLowerCase();
      for (var j=0; j<patterns.length; j++) if (h.indexOf(patterns[j].toLowerCase()) >= 0) return i;
    }
    return -1;
  }
  var idx = {
    date: hIdx(['date','วันที่','col1']),
    airline: hIdx(['airline','สายการบิน','carrier']),
    flt: hIdx(['flt','flight no','flight#','เที่ยว']),
    routing: hIdx(['routing','route','from-to']),
    sta: hIdx(['sta','arr time','arrival']),
    std: hIdx(['std','dep time','departure']),
    ac: hIdx(['a/c type','aircraft','aircraft type']),
    bay: hIdx(['bay','gate']),
    status: hIdx(['status']),
    type: hIdx(['type of flight','flight type']),
    team: hIdx(['team'])
  };
  // First column fallback for date
  if (idx.date < 0) idx.date = 0;
  var flights = [];
  // Thai month abbreviation → ISO
  var THAI_MON = {'ม.ค.':'01','ก.พ.':'02','มี.ค.':'03','เม.ย.':'04','พ.ค.':'05','มิ.ย.':'06','ก.ค.':'07','ส.ค.':'08','ก.ย.':'09','ต.ค.':'10','พ.ย.':'11','ธ.ค.':'12'};
  function parseDate(s){
    if (!s) return null;
    s = String(s).trim();
    // Already ISO
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[0];
    // Thai: "1 พ.ค. 2026"
    m = s.match(/(\d+)\s*(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.)\s*(\d{4})/);
    if (m){
      var day = m[1].padStart(2,'0'), mon = THAI_MON[m[2]], year = m[3];
      // Convert Buddhist year (2569) to Gregorian (2026) if needed
      var y = parseInt(year);
      if (y > 2500) y -= 543;
      return y + '-' + mon + '-' + day;
    }
    // DD/MM/YYYY
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m){
      var y = parseInt(m[3]); if (y > 2500) y -= 543;
      return y + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
    }
    return null;
  }
  function parseTime(s){
    if (!s) return '';
    s = String(s).trim();
    // 4-digit HHMM
    var m = s.match(/^(\d{2})(\d{2})/);
    if (m) return m[1]+':'+m[2];
    // HH:MM
    m = s.match(/^(\d{1,2}):(\d{2})/);
    if (m) return m[1].padStart(2,'0')+':'+m[2];
    return s;
  }
  for (var i=1; i<rows.length; i++){
    var r = rows[i];
    if (!r.length) continue;
    var dateRaw = idx.date >= 0 ? r[idx.date] : '';
    var iso = parseDate(dateRaw);
    if (!iso) continue;
    var airline = (idx.airline>=0 ? r[idx.airline] : '').toString().trim().toUpperCase();
    var fltRaw = (idx.flt>=0 ? r[idx.flt] : '').toString().trim();
    if (!airline && !fltRaw) continue;
    // FLT could be "743/744" — split into in/out
    var fltParts = fltRaw.split('/');
    var fltIn = airline + (fltParts[0]||'').replace(/\D/g,'');
    var fltOut = airline + (fltParts[1] || fltParts[0] || '').replace(/\D/g,'');
    if (!fltOut.match(/\d/)) fltOut = fltIn;
    var routing = (idx.routing>=0 ? r[idx.routing] : '').toString().trim();
    var rt = routing.split(/[-→]/).map(function(x){return x.trim();});
    var from = rt.length >= 2 ? rt[0] : 'XXX';
    var to = rt.length >= 2 ? rt[rt.length-1] : 'HKT';
    var sta = parseTime(idx.sta>=0 ? r[idx.sta] : '');
    var std = parseTime(idx.std>=0 ? r[idx.std] : '');
    var team = (idx.team>=0 ? r[idx.team] : guessTeam(airline)).toString().trim().toUpperCase();
    flights.push({
      id: flights.length+1,
      flight_no: fltOut || fltIn || (airline+'-'+(flights.length+1)),
      airline: airline,
      team: team,
      from: from || 'XXX',
      to: to || 'HKT',
      dep_time: std || sta,
      flight_date: iso,
      bay: (idx.bay>=0 ? r[idx.bay] : '') || ('B'+(flights.length+1)),
      gate: 'G'+((flights.length % 14)+1),
      aircraft: (idx.ac>=0 ? r[idx.ac] : 'A320'),
      pax: 200
    });
  }
  return flights;
}

/* Manual file import — handles both CSV and JSON */
window.importFlightsFile = function(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var text = e.target.result;
      var flights = null;
      var isJSON = file.name.toLowerCase().endsWith('.json') || /^\s*[\[{]/.test(text);
      if (isJSON){
        var data = JSON.parse(text);
        var arr = Array.isArray(data) ? data : (data.flights||data.rows||data.data||[]);
        if (!arr.length) throw new Error('JSON ว่างหรือ format ไม่ถูก');
        if (arr[0].flight_no || arr[0].flight_date){
          flights = arr.map(function(f,i){return Object.assign({bay:'B'+(i+1),gate:'G'+((i%14)+1),aircraft:'A320',pax:200}, f, {id:i+1});});
        } else {
          flights = rowsToFlights([Object.keys(arr[0])].concat(arr.map(function(o){return Object.values(o);})));
        }
      } else {
        var rows = parseCSV(text);
        flights = rowsToFlights(rows);
      }
      if (!flights || !flights.length){ alert('แปลงเป็น flights ไม่สำเร็จ — column header ต้องมี: Date Airlines FLT.No Routing STA STD'); return; }
      if (!confirm('Import '+flights.length+' flights? — จะแทนที่ flight schedule เดิม')) return;
      state.flights = flights;
      state.driveLastSync = new Date().toISOString();
      state.driveLastCount = flights.length;
      lsSave(); render();
      toast('✅ Imported '+flights.length+' flights');
    } catch(err){ alert('Import failed: '+err.message); }
  };
  reader.readAsText(file);
};

window.importStaffCSV = function(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var rows = parseCSV(e.target.result);
      if (rows.length < 2) throw new Error('CSV ว่าง');
      var headers = rows[0].map(function(h){return String(h).trim().toLowerCase();});
      function hIdx(p){for (var i=0;i<headers.length;i++) for (var j=0;j<p.length;j++) if(headers[i].indexOf(p[j])>=0) return i; return -1;}
      var iId = hIdx(['empid','id','รหัส']);
      var iName = hIdx(['name','first','ชื่อ']);
      var iLn = hIdx(['surname','last','สกุล']);
      var iPos = hIdx(['pos','position','ตำแหน่ง']);
      var iTeam = hIdx(['team','ทีม']);
      var staff = [];
      for (var i=1;i<rows.length;i++){
        var r = rows[i];
        if (!r.length) continue;
        var id = (iId>=0?r[iId]:'').toString().trim();
        if (!id) continue;
        var pos = ((iPos>=0?r[iPos]:'PSA')+'').toString().trim().toUpperCase();
        if (['SUPERVISOR','SPVR','SUP'].indexOf(pos)>=0) pos='SUP';
        else if (['SENIOR','SNR','ACT SNR'].indexOf(pos)>=0) pos='SNR';
        else pos='PSA';
        staff.push({i:id, n:(iName>=0?r[iName]:'')+'', ln:(iLn>=0?r[iLn]:'')+'', p:pos, t:(iTeam>=0?r[iTeam]:'EK')+''.toUpperCase(), active:true, sk:[]});
      }
      if (!staff.length) throw new Error('ไม่พบพนักงานใน CSV — header ต้องมี: EmpID, Name, Position, Team');
      if (!confirm('Import '+staff.length+' staff? — จะแทนที่รายชื่อเดิม')) return;
      state.staff = staff;
      ensureSkills();
      lsSave(); render();
      toast('✅ Imported '+staff.length+' staff');
    } catch(err){ alert('Import failed: '+err.message); }
  };
  reader.readAsText(file);
};

function renderSLABar(date){
  var fls = state.flights.filter(function(f){return f.flight_date===date;});
  if (!fls.length) return '';
  var ok=0, partial=0, critical=0;
  var areaStats = {ALL:{need:0,have:0}, CI:{need:0,have:0}, GATE:{need:0,have:0}, ARR:{need:0,have:0}};
  fls.forEach(function(f){
    var st = flightSlaStatus(f, date);
    if (st.status==='OK') ok++;
    else if (st.status==='PARTIAL') partial++;
    else critical++;
    Object.keys(areaStats).forEach(function(a){
      areaStats[a].need += st.byArea[a].need;
      areaStats[a].have += st.byArea[a].have;
    });
  });
  function pct(a){return a.need?Math.round(a.have/a.need*100):0;}
  var totalPct = pct({need:areaStats.ALL.need+areaStats.CI.need+areaStats.GATE.need+areaStats.ARR.need,
                      have:areaStats.ALL.have+areaStats.CI.have+areaStats.GATE.have+areaStats.ARR.have});
  function bar(label, st, col){
    var p = pct(st);
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'+
      '<span style="width:60px;font-size:11px;font-weight:700">'+label+'</span>'+
      '<div style="flex:1;background:var(--line);height:18px;border-radius:9px;overflow:hidden;position:relative">'+
        '<div style="width:'+Math.min(p,100)+'%;background:'+col+';height:100%;transition:.3s"></div>'+
        '<span style="position:absolute;top:0;left:8px;line-height:18px;font-size:10px;font-weight:700;color:'+(p>50?'white':'var(--text)')+'">'+st.have+'/'+st.need+' ('+p+'%)</span>'+
      '</div>'+
    '</div>';
  }
  return '<div class="card" style="margin-bottom:14px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'+
      '<h3 style="font-size:15px">📋 SLA Compliance — '+esc(date)+'</h3>'+
      '<div style="display:flex;gap:6px;font-size:11px">'+
        '<span class="badge badge-green">✓ '+ok+' OK</span>'+
        '<span class="badge badge-amber">◐ '+partial+' Partial</span>'+
        '<span class="badge badge-red">⚠ '+critical+' Critical</span>'+
      '</div>'+
    '</div>'+
    bar('Overall', {need:areaStats.ALL.need+areaStats.CI.need+areaStats.GATE.need+areaStats.ARR.need, have:areaStats.ALL.have+areaStats.CI.have+areaStats.GATE.have+areaStats.ARR.have}, totalPct>=95?'#16a34a':totalPct>=70?'#f59e0b':'#dc2626')+
    bar('Sup/All', areaStats.ALL, '#dc2626')+
    bar('Check-in', areaStats.CI, '#1d4ed8')+
    bar('Gate', areaStats.GATE, '#f59e0b')+
    bar('Arrival', areaStats.ARR, '#16a34a')+
  '</div>';
}

/* ── SLA Compliance — quick check on a flight ───────────────── */
function flightSlaStatus(f, date){
  var sla = getSLA(f.airline);
  var key = f.team+'-'+date+'-'+f.id;
  var fa = state.assignments[key]||{};
  var byArea = {ALL:{need:0,have:0}, CI:{need:0,have:0}, GATE:{need:0,have:0}, ARR:{need:0,have:0}};
  var rolesGap = [];
  sla.roles.forEach(function(r){
    var label = r[0], cnt = r[1], code = r.length>=3?r[2]:r[0], area = r.length>=4?r[3]:'ALL';
    var have = (fa[code]||[]).filter(function(x){return x;}).length;
    if (byArea[area]){byArea[area].need += cnt; byArea[area].have += have;}
    if (have < cnt) rolesGap.push({code:code, label:label, gap:cnt-have, area:area});
  });
  var totReq = sla.total, totHave = 0;
  Object.keys(fa).forEach(function(r){totHave += (fa[r]||[]).filter(function(x){return x;}).length;});
  var pct = totReq?totHave/totReq:0;
  var status = pct>=1?'OK':pct>=0.7?'PARTIAL':'CRITICAL';
  return {status:status, pct:Math.round(pct*100), have:totHave, need:totReq, byArea:byArea, gaps:rolesGap};
}

async function attLoad(force){

  var key = attRangeKey();
  if (!force && state.att.busy) return;
  if (!force && state.att.loaded && state.att.key === key) return;
  if (!gsAvailable()){ state.att.offline = true; state.att.loaded = true; state.att.key = key; render(); return; }
  state.att.busy = true; state.att.key = key;
  try {
    var d = await gsRun('attendanceBootstrap', state.date, state.att.from, state.att.to);
    if (d && d.error) throw new Error(d.error);
    state.att.offline   = false;
    state.att.err       = '';
    state.att.me        = d.me || '';
    state.att.canWrite  = !!d.canWrite;
    state.att.myEmpId   = d.myEmpId || '';
    state.att.outsource = d.outsource || [];
    state.att.records   = d.attendance || [];
    state.att.requests  = d.requests || [];
    state.att.loaded    = true;
  } catch(e){
    state.att.err = e.message || String(e);
    state.att.loaded = true;
  } finally {
    state.att.busy = false;
    render();
  }
}
/* Called from renderView — refetch when the date/range changed. */
function attEnsure(){
  if (state.att.busy) return;
  if (!state.att.loaded || state.att.key !== attRangeKey()) setTimeout(function(){ attLoad(false); }, 0);
}
window.attReload = function(){ attLoad(true); };

/* ── people: Outsource registry + (optionally) the staff master ── */
function attMasterPeople(){
  return state.staff.filter(function(s){ return s.active && inDept(s); })
    .map(function(s){ return {i:s.i, n:s.n, ln:s.ln, nth:s.nth||'', t:s.t, p:s.p, vendor:'', src:'PSA', active:true}; });
}
function attPeople(){
  var out = (state.att.outsource||[]).filter(function(s){ return s.active !== false; })
    .filter(function(s){ return state.dept === 'ALL' || teamDept(s.t) === state.dept || !s.t; });
  var pool = state.att.scope === 'OUT' ? out
           : state.att.scope === 'PSA' ? attMasterPeople()
           : out.concat(attMasterPeople());
  if (state.team !== 'ALL') pool = pool.filter(function(s){ return s.t === state.team; });
  return pool.sort(function(a,b){
    if (a.t !== b.t) return a.t < b.t ? -1 : 1;
    return a.n < b.n ? -1 : a.n > b.n ? 1 : 0;
  });
}
function attFindPerson(empId){
  var all = (state.att.outsource||[]).concat(attMasterPeople());
  return all.find(function(s){ return s.i === empId; }) || null;
}
function attRecMap(date){
  var m = {};
  (state.att.records||[]).forEach(function(r){ if (r.date === date) m[r.empId] = r; });
  return m;
}
function attReqsFor(empId){
  return (state.att.requests||[]).filter(function(q){ return q.empId === empId; });
}
/* Approved leave covering a date (roster may not be reloaded yet). */
function attLeaveOn(empId, date){
  return (state.att.requests||[]).find(function(q){
    return q.empId===empId && q.type==='LEAVE' && q.status==='APPROVED'
        && q.dateFrom <= date && q.dateTo >= date;
  }) || null;
}
function attShiftOf(person, date){
  var code = state.roster[person.t+'-'+date+'-'+person.i] || '';
  var info = lookupShift(code);
  return {code:code, info:info,
          label: info && info.kind==='WORK' ? info.in+'–'+info.out : (info ? info.label : '—')};
}
function attFlagBadges(flags){
  return (flags||[]).map(function(f){
    var d = ATT_FLAG_LABEL[f] || [f, ''];
    return '<span class="badge '+d[1]+'" style="font-size:9px">'+esc(d[0])+'</span>';
  }).join(' ');
}
function attHrs(v){ return v ? (Math.round(v*100)/100).toFixed(2) : '—'; }
function attTime(stamp){ var m = String(stamp||'').match(/ (\d{2}:\d{2})$/); return m ? m[1] : (stamp ? esc(stamp) : '—'); }
function attCanEdit(){ return !state.att.offline && state.att.canWrite; }

window.attImportVendorGo = async function(){
  function v(id){ var el=document.getElementById(id); return el?el.value.trim():''; }
  var raw = v('impFile');
  var m = raw.match(/[-\w]{25,}/);
  if (!m){ toast('ใส่ URL หรือ File ID ก่อน'); return; }
  var body = {fileId:m[0], sheet:v('impSheet'), team:(v('impTeam')||'OUT').toUpperCase()};
  attCloseModal();
  setApiPill('⏳ importing vendor file…', '#b58900');
  try {
    var d = await gsRun('importOutsourceFromDrive', body);
    if (d && d.error) throw new Error(d.error);
    // 1) register/refresh the people
    if (d.staff && d.staff.length){
      var sv = await gsRun('saveOutsourceStaff', {staff:d.staff});
      if (sv && sv.error) throw new Error(sv.error);
      if (sv && sv.outsource) state.att.outsource = sv.outsource;
    }
    // 2) merge shift cells into the shared roster (persisted by roster sync)
    var applied = 0;
    (d.cells||[]).forEach(function(c){
      if (state.roster[c.key] !== c.code){ state.roster[c.key] = c.code; applied++; }
    });
    if (applied) lsSave();
    toast('📥 Import สำเร็จ: พนักงาน '+d.staffCount+' คน · กะ '+d.n+' ช่อง (ใหม่ '+applied+') · OT '+d.otCount+' รายการ');
    setApiPill('🟢 live · can edit', '#2e7d32');
    attLoad(true);
  } catch(e){
    setApiPill('🟠 import failed', '#ef6c00');
    toast('❌ Import ล้มเหลว: '+(e.message||e));
  }
};

window.attExportCSV = function(){

  (state.att.records||[]).forEach(function(r){

               r.inAt, r.outAt, r.workHrs, r.otHrs, r.otApproved, r.flags.join(' '), r.status, r.note]);
  });
  var csv = rows.map(function(r){
    return r.map(function(c){ return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'; }).join(',');
  }).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'attendance_'+state.att.from+'_'+state.att.to+'.csv';

  if (state.att.to < state.att.from) state.att.to = state.att.from;
  attLoad(true);
};

function attBoard(){
  var date = state.date, people = attPeople(), recs = attRecMap(date);
  var st = {in:0, out:0, late:0, pending:0, leave:0, ot:0};
  people.forEach(function(p){
    var r = recs[p.i];
    if (attLeaveOn(p.i, date)) st.leave++;
    if (!r || !r.inAt) { if (!attLeaveOn(p.i, date)) st.pending++; return; }
    if (r.outAt) st.out++; else st.in++;
    if (r.flags.indexOf('LATE') >= 0) st.late++;
    st.ot += r.otHrs || 0;
  });

  var rows = people.map(function(p){
    var r = recs[p.i] || null;
    var sh = attShiftOf(p, date);
    var lv = attLeaveOn(p.i, date);
    var statusCell = lv ? '<span class="badge badge-purple">🌴 ลา '+esc(lv.subType)+'</span>'
      : !r || !r.inAt ? '<span class="badge">⏳ ยังไม่เข้า</span>'
      : r.outAt ? '<span class="badge badge-green">✅ ครบ</span>'
      : '<span class="badge badge-blue">🟦 อยู่ในกะ</span>';
    var act = '';
    if (attCanEdit() || state.att.myEmpId === p.i){
      if (!r || !r.inAt) act += '<button class="btn btn-primary btn-sm" onclick="attPunch(\''+esc(p.i)+'\',\'IN\')">✓ เช็คอิน</button> ';
      else if (!r.outAt) act += '<button class="btn btn-secondary btn-sm" onclick="attPunch(\''+esc(p.i)+'\',\'OUT\')">🏁 เช็คเอาท์</button> ';
    }
    if (attCanEdit()) act += '<button class="btn btn-ghost btn-sm" onclick="attEditRow(\''+esc(p.i)+'\')">✏️</button>';
    return '<tr data-q="'+esc((p.i+' '+p.n+' '+p.ln+' '+(p.nth||'')+' '+(p.vendor||'')+' '+(p.t||'')).toLowerCase())+'">'+
      '<td><span class="badge '+(p.src==='OUT'?'badge-amber':'badge-blue')+'" style="font-size:9px">'+(p.src==='OUT'?'OUT':'PSA')+'</span></td>'+
      '<td><b>'+esc(p.n)+'</b> '+esc(p.ln)+(p.vendor?'<div style="font-size:10px;color:var(--sub)">'+esc(p.vendor)+'</div>':'')+'</td>'+
      '<td class="mono" style="font-size:10px">'+esc(p.i)+'</td>'+
      '<td><span class="badge badge-brand">'+esc(p.t||'-')+'</span></td>'+
      '<td class="mono" style="font-size:11px">'+esc(sh.code||'—')+'<div style="font-size:10px;color:var(--sub)">'+esc(sh.label)+'</div></td>'+
      '<td>'+statusCell+'</td>'+
      '<td class="mono">'+(r?attTime(r.inAt):'—')+'</td>'+
      '<td class="mono">'+(r?attTime(r.outAt):'—')+'</td>'+
      '<td class="mono">'+(r?attHrs(r.workHrs):'—')+'</td>'+
      '<td class="mono">'+(r&&r.otHrs?attHrs(r.otHrs)+(r.otApproved?'<div style="font-size:10px;color:var(--sub)">อนุมัติ '+attHrs(r.otApproved)+'</div>':''):'—')+'</td>'+
      '<td>'+(r?attFlagBadges(r.flags):'')+'</td>'+
      '<td style="white-space:nowrap">'+act+'</td>'+
    '</tr>';
  }).join('');

  return `
    <div class="kpi" style="margin-bottom:12px">
      <div class="kpi-card k-blue"><div class="lbl">อยู่ในกะ</div><div class="val">${st.in}</div><div class="sub">เช็คอินแล้ว ยังไม่ออก</div></div>
      <div class="kpi-card k-green"><div class="lbl">ครบกะ</div><div class="val">${st.out}</div><div class="sub">เช็คเอาท์แล้ว</div></div>
      <div class="kpi-card k-amber"><div class="lbl">มาสาย</div><div class="val">${st.late}</div><div class="sub">เกินเวลากะ 15 นาที</div></div>
      <div class="kpi-card"><div class="lbl">ยังไม่เข้า</div><div class="val">${st.pending}</div><div class="sub">ไม่รวมคนลา</div></div>
      <div class="kpi-card k-red"><div class="lbl">OT วันนี้</div><div class="val">${attHrs(st.ot)}</div><div class="sub">ชั่วโมงจากเวลาจริง</div></div>
      <div class="kpi-card"><div class="lbl">ลา</div><div class="val">${st.leave}</div><div class="sub">อนุมัติแล้ว</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
      <input class="input" placeholder="🔍 ค้นหา ชื่อ / รหัส / vendor…" style="max-width:320px"
        oninput="var v=this.value.toLowerCase();document.querySelectorAll('#attRows tr').forEach(function(tr){tr.style.display=tr.dataset.q.indexOf(v)>=0?'':'none';})">
      <button class="btn btn-secondary btn-sm" onclick="attOpenReq('OT')">⚡ ขอ OT</button>
      <button class="btn btn-secondary btn-sm" onclick="attOpenReq('LEAVE')">🌴 ขอลา</button>
      <button class="btn btn-secondary btn-sm" onclick="attExportCSV()">⬇ CSV</button>
    </div>
    <div class="tbl-wrap" style="max-height:65vh"><table class="tbl">
      <thead><tr><th>ประเภท</th><th>ชื่อ</th><th>รหัส</th><th>ทีม</th><th>กะ</th><th>สถานะ</th>
        <th>เข้า</th><th>ออก</th><th>ชม.</th><th>OT</th><th>ธง</th><th>จัดการ</th></tr></thead>
      <tbody id="attRows">${rows || '<tr><td colspan="12" style="text-align:center;color:var(--sub);padding:20px">ไม่มีพนักงานในกลุ่มที่เลือก — เพิ่มที่แท็บ “ทะเบียน Outsource”</td></tr>'}</tbody>
    </table></div>`;
}

      '<div style="font-size:12px" class="mono">IN '+(r?attTime(r.inAt):'—')+' · OUT '+(r?attTime(r.outAt):'—')+'</div>'+
      (canPunch ? '<div style="display:flex;gap:6px;margin-top:8px">'+

        '<button class="btn btn-secondary btn-sm" onclick="attPunch(\''+esc(p.i)+'\',\'OUT\')" '+(!r||!r.inAt||r.outAt?'disabled':'')+'>🏁 OUT</button>'+
      '</div>' : '')+

      oninput="var v=this.value.toLowerCase();document.querySelectorAll('#attCards .card').forEach(function(c){c.style.display=c.dataset.q.indexOf(v)>=0?'':'none';})">
    <div id="attCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px">
      ${cards || '<div class="sub">ไม่มีพนักงานในกลุ่มที่เลือก</div>'}
    </div>`;
}

function attReport(){
  var recs = (state.att.records||[]);
  var byEmp = {};
  recs.forEach(function(r){
    if (state.team !== 'ALL' && r.team !== state.team) return;
    if (state.att.scope === 'OUT' && r.source !== 'OUT') return;
    if (state.att.scope === 'PSA' && r.source === 'OUT') return;
    var e = byEmp[r.empId] || (byEmp[r.empId] = {empId:r.empId, name:r.name, vendor:r.vendor, team:r.team,
      days:0, work:0, ot:0, otApp:0, late:0, early:0, noOut:0, unapp:0, leave:0});
    e.days++; e.work += r.workHrs||0; e.ot += r.otHrs||0; e.otApp += r.otApproved||0;
    if (r.flags.indexOf('LATE')>=0) e.late++;
    if (r.flags.indexOf('EARLY_OUT')>=0) e.early++;
    if (r.flags.indexOf('NO_OUT')>=0) e.noOut++;
    if (r.flags.indexOf('OT_UNAPPROVED')>=0) e.unapp++;
  });
  (state.att.requests||[]).forEach(function(q){
    if (q.type!=='LEAVE' || q.status!=='APPROVED') return;
    if (q.dateTo < state.att.from || q.dateFrom > state.att.to) return;
    var e = byEmp[q.empId] || (byEmp[q.empId] = {empId:q.empId, name:q.name, vendor:q.vendor, team:q.team,
      days:0, work:0, ot:0, otApp:0, late:0, early:0, noOut:0, unapp:0, leave:0});
    var a = q.dateFrom < state.att.from ? state.att.from : q.dateFrom;
    var b = q.dateTo   > state.att.to   ? state.att.to   : q.dateTo;
    e.leave += Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000) + 1;
  });
  var list = Object.keys(byEmp).map(function(k){return byEmp[k];})
    .sort(function(a,b){ return b.ot - a.ot || (a.name < b.name ? -1 : 1); });
  var tot = list.reduce(function(a,e){ a.work+=e.work; a.ot+=e.ot; a.otApp+=e.otApp; a.late+=e.late; a.leave+=e.leave; return a; },
                        {work:0, ot:0, otApp:0, late:0, leave:0});
  var rows = list.map(function(e){
    return '<tr>'+
      '<td><b>'+esc(e.name||e.empId)+'</b>'+(e.vendor?'<div style="font-size:10px;color:var(--sub)">'+esc(e.vendor)+'</div>':'')+'</td>'+
      '<td class="mono" style="font-size:10px">'+esc(e.empId)+'</td>'+
      '<td><span class="badge badge-brand">'+esc(e.team||'-')+'</span></td>'+
      '<td class="mono">'+e.days+'</td>'+
      '<td class="mono">'+attHrs(e.work)+'</td>'+
      '<td class="mono">'+attHrs(e.ot)+'</td>'+
      '<td class="mono">'+attHrs(e.otApp)+'</td>'+
      '<td class="mono">'+(e.unapp?'<span class="badge badge-red">'+e.unapp+'</span>':'—')+'</td>'+
      '<td class="mono">'+(e.late||'—')+'</td>'+
      '<td class="mono">'+(e.early||'—')+'</td>'+
      '<td class="mono">'+(e.noOut?'<span class="badge badge-red">'+e.noOut+'</span>':'—')+'</td>'+
      '<td class="mono">'+(e.leave||'—')+'</td>'+
    '</tr>';
  }).join('');
  return `
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
      <label style="font-size:12px;color:var(--sub);font-weight:700">ช่วงวันที่</label>
      <input type="date" class="input" style="width:auto" value="${esc(state.att.from)}" onchange="attSetRange('from',this.value)">
      <span>→</span>
      <input type="date" class="input" style="width:auto" value="${esc(state.att.to)}" onchange="attSetRange('to',this.value)">
      <button class="btn btn-secondary btn-sm" onclick="attExportCSV()">⬇ CSV (รายวัน)</button>
    </div>
    <div class="kpi" style="margin-bottom:12px">
      <div class="kpi-card"><div class="lbl">พนักงาน</div><div class="val">${list.length}</div><div class="sub">มีการลงเวลา</div></div>
      <div class="kpi-card k-blue"><div class="lbl">ชั่วโมงรวม</div><div class="val">${attHrs(tot.work)}</div><div class="sub">จากเวลาจริง</div></div>
      <div class="kpi-card k-red"><div class="lbl">OT รวม</div><div class="val">${attHrs(tot.ot)}</div><div class="sub">อนุมัติแล้ว ${attHrs(tot.otApp)}</div></div>
      <div class="kpi-card k-amber"><div class="lbl">มาสาย</div><div class="val">${tot.late}</div><div class="sub">ครั้ง</div></div>
      <div class="kpi-card"><div class="lbl">วันลา</div><div class="val">${tot.leave}</div><div class="sub">อนุมัติแล้ว</div></div>
    </div>
    <div class="tbl-wrap" style="max-height:60vh"><table class="tbl">
      <thead><tr><th>ชื่อ</th><th>รหัส</th><th>ทีม</th><th>วันทำงาน</th><th>ชม.รวม</th><th>OT</th><th>OT อนุมัติ</th>
        <th>OT เกิน</th><th>สาย</th><th>ออกก่อน</th><th>ไม่เช็คเอาท์</th><th>วันลา</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="12" style="text-align:center;color:var(--sub);padding:20px">ไม่มีข้อมูลในช่วงนี้</td></tr>'}</tbody>
    </table></div>`;
}

  return `

      ${attCanEdit()?'<button class="btn btn-primary btn-sm" onclick="attStaffModal()">➕ เพิ่มพนักงาน Outsource</button>'+

    </div>
    <div class="tbl-wrap" style="max-height:65vh"><table class="tbl">
      <thead><tr><th>รหัส</th><th>ชื่อ</th><th>Vendor</th><th>ทีม</th><th>ตำแหน่ง</th><th>ติดต่อ</th><th>สัญญา</th><th>สถานะ</th><th></th></tr></thead>

    </table></div>`;
}

/* ══ VIEW: OT & Leave requests ══ */
function renderRequests(){
  attEnsure();
  var all = state.att.requests || [];
  var pending = all.filter(function(q){ return q.status === 'PENDING'; });
  var mine = state.att.myEmpId
    ? all.filter(function(q){ return q.empId === state.att.myEmpId || (q.createdBy||'').toLowerCase() === (state.att.me||'').toLowerCase(); })
    : all.filter(function(q){ return (q.createdBy||'').toLowerCase() === (state.att.me||'').toLowerCase(); });
  var tabs = [['approvals','📥 รออนุมัติ ('+pending.length+')'],['all','📚 ทั้งหมด'],['mine','🙋 ของฉัน ('+mine.length+')']];
  var list = state.att.reqTab === 'approvals' ? pending
           : state.att.reqTab === 'mine' ? mine
           : (state.att.reqFilter === 'ALL' ? all : all.filter(function(q){ return q.status === state.att.reqFilter; }));

  var otPending = pending.filter(function(q){return q.type==='OT';}).length;
  var lvPending = pending.length - otPending;
  var otHrsPending = pending.filter(function(q){return q.type==='OT';})
    .reduce(function(a,q){ return a + (q.hours||0) * (q.days||1); }, 0);

  return `
    <div class="phdr">
      <div><h2>📝 ขอ OT · ขอลา — OT & Leave</h2>
        <div class="sub">${state.att.busy?'⏳ กำลังโหลด…':all.length+' คำขอทั้งหมด · รออนุมัติ '+pending.length}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="attOpenReq('OT')">⚡ ขอ OT</button>
        <button class="btn btn-primary btn-sm" onclick="attOpenReq('LEAVE')">🌴 ขอลา</button>
        <button class="btn btn-secondary btn-sm" onclick="attReload()">🔄 รีเฟรช</button>
      </div>
    </div>
    ${attBanner()}
    <div class="kpi" style="margin-bottom:12px">
      <div class="kpi-card k-amber"><div class="lbl">รออนุมัติ</div><div class="val">${pending.length}</div><div class="sub">ทั้งหมด</div></div>
      <div class="kpi-card k-red"><div class="lbl">OT รออนุมัติ</div><div class="val">${otPending}</div><div class="sub">${attHrs(otHrsPending)} ชม.</div></div>
      <div class="kpi-card k-blue"><div class="lbl">ลารออนุมัติ</div><div class="val">${lvPending}</div><div class="sub">คำขอ</div></div>
      <div class="kpi-card k-green"><div class="lbl">อนุมัติแล้ว</div><div class="val">${all.filter(function(q){return q.status==='APPROVED';}).length}</div><div class="sub">ทั้งช่วงข้อมูล</div></div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
      ${tabs.map(function(t){return '<button class="btn btn-sm '+(state.att.reqTab===t[0]?'btn-primary':'btn-secondary')+'" onclick="attSetReqTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')}
      ${state.att.reqTab==='all' ? '<select class="select" style="width:auto;margin-left:auto" onchange="attSetFilter(this.value)">'+
        ['ALL','PENDING','APPROVED','REJECTED','CANCELLED'].map(function(s){
          return '<option value="'+s+'"'+(state.att.reqFilter===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select>' : ''}
    </div>
    ${attReqTable(list)}`;
}

function attReqTable(list){
  var badge = {PENDING:'badge-amber', APPROVED:'badge-green', REJECTED:'badge-red', CANCELLED:''};
  var rows = list.map(function(q){
    var act = '';
    if (attCanEdit() && q.status === 'PENDING'){
      act += '<button class="btn btn-primary btn-sm" onclick="attDecide(\''+esc(q.reqId)+'\',\'APPROVE\')">✅</button> '+
             '<button class="btn btn-secondary btn-sm" onclick="attDecide(\''+esc(q.reqId)+'\',\'REJECT\')">❌</button> ';
    }
    if (q.status === 'PENDING' || (q.status === 'APPROVED' && attCanEdit())){
      act += '<button class="btn btn-ghost btn-sm" onclick="attCancelReq(\''+esc(q.reqId)+'\')">🚫</button>';
    }
    var span = q.dateFrom + (q.dateTo !== q.dateFrom ? ' → ' + q.dateTo : '');
    var detail = q.type === 'OT'
      ? attHrs(q.hours)+' ชม./วัน'+(q.timeFrom?' ('+esc(q.timeFrom)+'–'+esc(q.timeTo||'')+')':'')
      : esc(q.subType)+' · '+q.days+' วัน';
    return '<tr>'+
      '<td class="mono" style="font-size:10px">'+esc(q.reqId)+'</td>'+
      '<td><span class="badge '+(q.type==='OT'?'badge-red':'badge-blue')+'">'+(q.type==='OT'?'⚡ OT':'🌴 LEAVE')+'</span></td>'+
      '<td><b>'+esc(q.name||q.empId)+'</b><div style="font-size:10px;color:var(--sub)">'+esc(q.empId)+(q.vendor?' · '+esc(q.vendor):'')+'</div></td>'+
      '<td><span class="badge badge-brand">'+esc(q.team||'-')+'</span></td>'+
      '<td class="mono" style="font-size:11px">'+esc(span)+'</td>'+
      '<td style="font-size:11px">'+detail+'</td>'+
      '<td style="font-size:11px;max-width:220px">'+esc(q.reason||'—')+'</td>'+
      '<td><span class="badge '+(badge[q.status]||'')+'">'+esc(q.status)+'</span>'+
        (q.decidedBy?'<div style="font-size:10px;color:var(--sub)">'+esc(q.decidedBy)+'</div>':'')+
        (q.decideNote?'<div style="font-size:10px;color:var(--sub)">“'+esc(q.decideNote)+'”</div>':'')+'</td>'+
      '<td style="font-size:10px;color:var(--sub)">'+esc(q.createdAt)+'<div>'+esc(q.createdBy)+'</div></td>'+
      '<td style="white-space:nowrap">'+act+'</td>'+
    '</tr>';
  }).join('');
  return '<div class="tbl-wrap" style="max-height:62vh"><table class="tbl">'+
    '<thead><tr><th>เลขที่</th><th>ประเภท</th><th>พนักงาน</th><th>ทีม</th><th>วันที่</th><th>รายละเอียด</th>'+
    '<th>เหตุผล</th><th>สถานะ</th><th>ยื่นเมื่อ</th><th></th></tr></thead>'+
    '<tbody>'+(rows || '<tr><td colspan="10" style="text-align:center;color:var(--sub);padding:20px">ไม่มีคำขอในกลุ่มนี้</td></tr>')+'</tbody>'+
    '</table></div>';
}

function init() {
  var loaded = lsLoad();
  // LIVE DATA MODE: clear any old cached sample data
  try { localStorage.removeItem('psahkt'); localStorage.removeItem('psahkt_classic'); } catch(e){}
  if (!loaded || !state.staff.length) state.staff = genStaff();
  if (!state.flights || !state.flights.length) state.flights = genFlights();
  if (!state.checkin) state.checkin = {};
  // Pre-populate Apps Script URL if user hasn't set one
  if (!state.driveSyncUrl){
    state.driveSyncUrl = API_URL;
  }
  ensureSkills();   // Stamp default skills onto staff
  render();
  // Bridge: bootstrap from Apps Script (staff+flights+assignments+canWrite),
  // then poll every 10s to pick up other users' edits.
  setTimeout(function(){
    apiBootstrap().then(function(){
      setInterval(apiPoll, 10000);          // assignments — others' edits
      setInterval(apiRefreshFlights, 60000); // flight schedule — auto, no button
    });
  }, 300);
}

init();
</script>
</body>
</html>
