<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PSA-HKT Roster — LIVE DATA · 04 MAY 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --brand:#0d9488; --brand-dark:#0f766e; --brand-soft:#ccfbf1;
  --bg:#f8fafc; --paper:#ffffff; --text:#0f172a; --sub:#64748b;
  --line:#e2e8f0; --line2:#cbd5e1; --hover:#f1f5f9;
  --r:10px; --shadow:0 1px 2px rgba(15,23,42,.04), 0 4px 12px rgba(15,23,42,.04);
  --ui:'Plus Jakarta Sans','Noto Sans Thai',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
[data-theme="dark"] {
  --bg:#0f172a; --paper:#1e293b; --text:#f1f5f9; --sub:#94a3b8;
  --line:#334155; --line2:#475569; --hover:#334155;
  --shadow:0 4px 12px rgba(0,0,0,.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--ui); background:var(--bg); color:var(--text); font-size:14px; min-height:100vh; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:var(--line2); border-radius:4px; }

/* Sortable column header hover */
.tbl thead th.th-sort:hover { background:var(--brand-soft); color:var(--brand-dark); }

/* Eligibility-violation chip */
.chip.chip-bad { border:1.5px solid #dc2626; background:#fee2e2; color:#991b1b; }

/* Gantt chart styles */
.g-wrap { position:relative; padding-top:22px; padding-left:90px; max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding-right:12px; padding-bottom:8px; }
.g-wrap.g-wrap-stair { padding-left:140px; max-height:720px; }
.g-wrap.g-wrap-stair .g-hours { left:140px; }
.g-hours { position:absolute; top:4px; left:90px; right:12px; height:18px; pointer-events:none; }
.g-hours::before { content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--line); }
.g-h { position:absolute; transform:translateX(-50%); font-size:10px; color:var(--sub); font-family:var(--mono); top:0; }
.g-h::after { content:''; position:absolute; left:50%; top:14px; width:1px; height:6px; background:var(--line2); }
.g-row { display:flex; align-items:center; height:24px; margin:0 0 3px 0; }
.g-row.g-stair { height:20px; margin-bottom:1px; }
.g-lab { width:80px; flex-shrink:0; margin-left:-90px; font-size:11px; font-weight:700; color:var(--text); padding-right:10px; text-align:right; }
.g-lab.g-lab-stair { width:130px; margin-left:-140px; text-align:left; padding-right:8px; padding-left:6px; white-space:nowrap; overflow:hidden; }
.g-lab .g-cnt { color:var(--sub); font-weight:400; font-size:10px; margin-left:4px; }
.g-track { position:relative; flex:1; height:20px; background:linear-gradient(to right, var(--bg) 0, var(--bg) 100%); border-radius:4px; border:1px solid var(--line); }
.g-grid { position:absolute; top:0; bottom:0; border-left:1px dashed var(--line); pointer-events:none; }
.g-bar { position:absolute; top:1px; bottom:1px; border-radius:3px; padding:0 5px; font-size:9px; color:white; line-height:18px; overflow:hidden; white-space:nowrap; cursor:pointer; font-weight:700; letter-spacing:.2px; transition:.15s; min-width:14px; }
.g-bar:hover { z-index:5; transform:translateY(-1px) scale(1.02); box-shadow:0 4px 12px rgba(0,0,0,.25); filter:brightness(1.1); }
.g-bar.now-line { background:var(--brand); width:2px !important; padding:0; z-index:10; }
.g-now { position:absolute; top:-22px; bottom:0; width:2px; background:#dc2626; z-index:6; pointer-events:none; }
.g-now::after { content:'NOW'; position:absolute; top:-2px; left:3px; font-size:9px; font-weight:700; color:#dc2626; }

/* ─── Layout ─── */
.app { display:flex; min-height:100vh; }
.sidebar {
  width:240px; flex-shrink:0;
  background:var(--paper); border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.sb-brand { padding:18px 18px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
.sb-logo {
  width:40px; height:40px; border-radius:10px;
  background:var(--brand); color:white;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:18px;
}
.sb-name { font-weight:700; font-size:15px; line-height:1.2; }
.sb-sub { font-size:11px; color:var(--sub); margin-top:2px; }
.sb-nav { flex:1; padding:14px 12px; overflow-y:auto; }
.sb-item {
  display:flex; align-items:center; gap:12px;
  padding:11px 14px; border-radius:9px; cursor:pointer;
  font-weight:500; font-size:14px; color:var(--sub);
  transition:.15s; border:none; background:none; width:100%;
  font-family:var(--ui); margin-bottom:2px;
}
.sb-item:hover { background:var(--hover); color:var(--text); }
.sb-item.on { background:var(--brand); color:white; box-shadow:0 4px 12px rgba(13,148,136,.25); }
.sb-icon { font-size:16px; width:22px; text-align:center; }
.sb-foot { padding:14px; border-top:1px solid var(--line); }
.sb-user { display:flex; align-items:center; gap:10px; padding:6px; }
.sb-avatar { width:34px; height:34px; border-radius:50%; background:var(--brand-soft); color:var(--brand-dark); display:flex; align-items:center; justify-content:center; font-weight:700; }
.sb-uname { font-size:13px; font-weight:600; }
.sb-urole { font-size:11px; color:var(--sub); }

/* ─── Main ─── */
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar {
  position:sticky; top:0; z-index:30;
  background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:12px 22px; display:flex; align-items:center; gap:12px;
}
[data-theme="dark"] .topbar { background:rgba(30,41,59,.92); }
.topbar h1 { font-size:18px; font-weight:700; }
.spacer { flex:1; }
.icon-btn {
  width:36px; height:36px; border-radius:50%;
  border:none; background:transparent; font-size:16px;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:hover { background:var(--hover); }

.panel { padding:22px; max-width:1500px; margin:0 auto; width:100%; flex:1; }

/* ─── Phdr ─── */
.phdr { margin-bottom:18px; display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; }
.phdr h2 { font-size:22px; font-weight:700; }
.phdr .sub { color:var(--sub); font-size:13px; margin-top:4px; }

/* ─── Buttons ─── */
.btn {
  font-family:var(--ui); font-weight:500; font-size:13px;
  padding:8px 16px; border-radius:8px; border:1px solid transparent;
  display:inline-flex; align-items:center; gap:6px; transition:.15s;
}
.btn-primary { background:var(--brand); color:white; border-color:var(--brand); }
.btn-primary:hover { background:var(--brand-dark); }
.btn-secondary { background:var(--paper); color:var(--text); border-color:var(--line2); }
.btn-secondary:hover { background:var(--hover); }
.btn-ghost { background:transparent; color:var(--text); }
.btn-sm { padding:5px 12px; font-size:12px; }

/* ─── Card ─── */
.card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:18px; box-shadow:var(--shadow); }

/* ─── Badge ─── */
.badge { display:inline-block; padding:2px 9px; border-radius:12px; font-size:11px; font-weight:600; background:var(--hover); }
.badge-brand { background:var(--brand-soft); color:var(--brand-dark); }
.badge-blue { background:#dbeafe; color:#1e40af; }
.badge-green { background:#d1fae5; color:#065f46; }
.badge-red { background:#fee2e2; color:#991b1b; }
.badge-amber { background:#fef3c7; color:#92400e; }
.badge-purple { background:#e9d5ff; color:#6b21a8; }

/* ─── KPI ─── */
.kpi { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; margin-bottom:22px; }
.kpi-card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px; transition:.2s; }
.kpi-card:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
.kpi-card .lbl { font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
.kpi-card .val { font-family:var(--mono); font-size:30px; font-weight:700; color:var(--brand); margin-top:6px; line-height:1; }
.kpi-card .sub { font-size:11px; color:var(--sub); margin-top:5px; }
.kpi-card.k-blue .val { color:#2563eb; }
.kpi-card.k-green .val { color:#059669; }
.kpi-card.k-red .val { color:#dc2626; }
.kpi-card.k-amber .val { color:#d97706; }

/* ─── Table ─── */
.tbl-wrap { background:var(--paper); border:1px solid var(--line); border-radius:12px; overflow:auto; }
table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
table.tbl th {
  background:var(--bg); color:var(--sub); font-weight:600;
  font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); position:sticky; top:0;
}
table.tbl td { padding:9px 12px; border-bottom:1px solid var(--line); }
table.tbl tbody tr:hover { background:var(--bg); }

/* ─── Form ─── */
.field { margin-bottom:14px; }
.label { display:block; font-size:12px; font-weight:600; color:var(--sub); margin-bottom:5px; }
.input, .select {
  width:100%; padding:9px 12px; font-size:13px;
  border:1px solid var(--line2); background:var(--paper); color:var(--text);
  border-radius:8px; outline:none; font-family:var(--ui);
}
.input:focus, .select:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(13,148,136,.15); }
.fbar { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; background:var(--paper); border:1px solid var(--line); padding:12px 14px; border-radius:12px; margin-bottom:14px; }

/* ─── Flight Card ─── */
.fc { background:var(--paper); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; }
.fc-hdr { padding:12px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--line); background:linear-gradient(to right, var(--brand-soft), transparent); }
.fc-num { font-weight:700; font-size:16px; }
.fc-time { font-family:var(--mono); font-size:12px; color:var(--sub); }
.fc-stat { margin-left:auto; font-family:var(--mono); font-weight:700; }
.fc-stat.ok { color:#059669; }
.fc-stat.warn { color:#d97706; }
.fc-stat.bad { color:#dc2626; }
.tlbar { height:14px; background:var(--hover); border-radius:3px; position:relative; margin:10px 16px; overflow:hidden; }
.tl-seg { position:absolute; top:0; height:100%; display:flex; align-items:center; justify-content:center; font-size:8px; color:white; font-weight:600; }
.tl-brief { background:#d97706; }
.tl-ci { background:#10b981; }
.tl-cl { background:#dc2626; }
.tl-gate { background:#0ea5e9; }
.tl-post { background:#d97706; }
.rrow { display:flex; align-items:center; padding:7px 16px; border-top:1px solid var(--line); gap:10px; min-height:36px; }
.rrow:hover { background:var(--bg); }
.rlabel { width:80px; font-size:12px; font-weight:600; }
.rcnt { width:42px; font-family:var(--mono); font-size:11px; color:var(--sub); }
.rchips { display:flex; flex-wrap:wrap; gap:4px; flex:1; }
.chip { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; font-size:11px; border-radius:14px; background:var(--brand-soft); color:var(--brand-dark); cursor:pointer; }
.chip:hover { background:var(--brand); color:white; }
.chip-empty { background:transparent; border:1px dashed var(--line2); color:var(--sub); }
.chip-empty:hover { border-color:var(--brand); color:var(--brand); background:transparent; }

/* ─── Roster ─── */
.roster-wrap { background:var(--paper); border:1px solid var(--line); border-radius:12px; overflow:auto; max-height:calc(100vh - 240px); }
table.roster { border-collapse:collapse; font-size:11px; min-width:100%; }
table.roster th { background:var(--bg); color:var(--sub); padding:6px 4px; font-weight:600; text-align:center; position:sticky; top:0; min-width:30px; }
table.roster th.sun { color:#dc2626; }
table.roster th.tname { text-align:left; min-width:140px; padding:6px 12px; position:sticky; left:0; z-index:6; background:var(--bg); }
table.roster td { border:1px solid var(--line); padding:3px 4px; text-align:center; cursor:pointer; font-family:var(--mono); font-weight:600; min-width:30px; }
table.roster td.tname { text-align:left; padding:5px 12px; position:sticky; left:0; background:var(--paper); z-index:4; font-family:var(--ui); font-weight:500; }
table.roster td.hrs { background:var(--bg); font-weight:700; }
.rc-work { background:#dbeafe; color:#1e40af; }
.rc-work.rc-ot { background:#fee2e2; color:#991b1b; font-weight:700; position:relative; }
.rc-work.rc-ot::after { content:''; position:absolute; top:1px; right:1px; width:5px; height:5px; border-radius:50%; background:#dc2626; }
.rc-off { background:#f1f5f9; color:#64748b; }
.rc-otoff { background:#fef2f2; color:#dc2626; font-weight:700; }
.rc-vac { background:#fef3c7; color:#92400e; }
.rc-swap { background:#e0e7ff; color:#4338ca; }
.rc-trn { background:#cffafe; color:#0e7490; }
.hrs-warn { color:#b45309; font-weight:700; }
.hrs-ot { color:#dc2626; font-weight:800; }
.roster tr.tr-violation { background:#fef2f2 !important; }
.roster tr.tr-violation td.tname { background:#fee2e2 !important; border-left:3px solid #dc2626 !important; }
.roster tr.tr-violation:hover { background:#fecaca !important; }

/* Month calendar grid */
.m-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.m-head { font-size:11px; font-weight:700; text-align:center; padding:6px 0; color:var(--sub); }
.m-cell { min-height:78px; border:1px solid var(--line); border-radius:6px; padding:6px; cursor:pointer; transition:.15s; position:relative; }
.m-cell:hover:not(.m-empty) { border-color:var(--brand); transform:translateY(-1px); box-shadow:0 4px 8px rgba(13,148,136,.15); }
.m-empty { border:none; cursor:default; }
.m-d { font-size:13px; font-weight:700; }
.m-c { font-size:10px; color:var(--sub); margin-top:4px; }
.m-cell.m-lo { background:#dcfce7; }
.m-cell.m-mid { background:#fef3c7; }
.m-cell.m-hi { background:#fee2e2; }
.m-cell.m-today { border-color:var(--brand); border-width:2px; }
.m-cell.m-sel { outline:2px solid var(--brand); outline-offset:1px; }
.m-cell.m-sun .m-d { color:#dc2626; }
.m-leg { display:inline-block; width:14px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
.m-leg.m-lo { background:#dcfce7; }
.m-leg.m-mid { background:#fef3c7; }
.m-leg.m-hi { background:#fee2e2; }

/* Team Assign worksheet (PSA-HKT Excel-style) */
.ta-tbl { width:100%; border-collapse:collapse; font-size:11px; }
.ta-tbl th { background:var(--paper); padding:6px 4px; text-align:center; border:1px solid var(--line); font-weight:700; font-size:10px; color:var(--text); position:sticky; top:0; z-index:2; }
.ta-tbl td { border:1px solid var(--line); padding:4px 6px; vertical-align:middle; }
.ta-tbl tr:nth-child(even) td { background:#fafbfc; }
.ta-tbl .ta-name { text-align:left; min-width:140px; font-weight:600; }
.ta-tbl .ta-id { font-family:var(--mono); font-size:10px; color:var(--sub); }
.ta-tbl .ta-shift { text-align:center; font-family:var(--mono); font-weight:700; cursor:pointer; }
.ta-tbl .ta-shift:hover { background:var(--brand-soft); }
.ta-tbl .ta-time { text-align:center; font-family:var(--mono); font-size:10px; }
.ta-tbl .ta-flt-h { font-size:9px; line-height:1.2; }
.ta-tbl .ta-cell { text-align:center; min-width:38px; cursor:pointer; }
.ta-tbl .ta-cell:hover { background:var(--brand-soft); }
.ta-tbl .ta-cell.has { background:#dcfce7; color:#166534; font-weight:700; padding:2px; }
.ta-tbl .ta-rcode { display:inline-block; background:white; color:#166534; font-size:9px; padding:1px 3px; border-radius:3px; margin:1px; font-family:var(--mono); border:1px solid #16a34a; cursor:pointer; transition:.1s; }
.ta-tbl .ta-rcode:hover { background:#fee2e2; border-color:#dc2626; color:#991b1b; }
.ta-tbl .ta-rcode .ta-x { margin-left:3px; font-weight:800; opacity:.5; }
.ta-tbl .ta-rcode:hover .ta-x { opacity:1; }
.ta-tbl .ta-add { display:inline-block; padding:1px 5px; margin:1px; font-size:11px; font-weight:700; color:var(--brand); cursor:pointer; border:1px dashed var(--line2); border-radius:3px; background:white; }
.ta-tbl .ta-add:hover { background:var(--brand-soft); border-color:var(--brand); color:var(--brand-dark); }

/* Edit-modal chip styling */
.ed-section { background:var(--brand-soft); padding:10px; border-radius:8px; margin-bottom:10px; }
.ed-label { font-size:11px; font-weight:700; color:var(--text); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
.ed-chips { display:flex; flex-wrap:wrap; gap:4px; }
.ed-chip { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; background:white; border:1.5px solid var(--brand); color:var(--brand-dark); font-size:11px; font-weight:700; border-radius:4px; cursor:pointer; transition:.15s; }
.ed-chip:hover { background:#fee2e2; border-color:#dc2626; color:#dc2626; }
.ed-chip .ed-x { font-size:13px; opacity:.6; }
.ed-chip:hover .ed-x { opacity:1; }
.ta-tbl .ta-pos-SUP { background:#fee2e2 !important; color:#991b1b; font-weight:700; }
.ta-tbl .ta-pos-SNR { background:#dcfce7 !important; color:#166534; font-weight:700; }
.ta-tbl .ta-pos-PSA { background:#dbeafe !important; color:#1e40af; }
.ta-tbl .ta-ot { background:#fef2f2 !important; color:#dc2626; font-weight:700; }

/* ─── Heatmap ─── */
.hm-wrap { overflow-x:auto; }
.hm-axis { display:flex; gap:1px; margin-left:122px; margin-bottom:6px; }
.hm-h { flex:1; text-align:center; font-size:9px; color:var(--sub); font-family:var(--mono); min-width:24px; }
.hm-row { display:flex; gap:1px; margin-bottom:1px; align-items:center; }
.hm-label { width:120px; font-size:11px; font-weight:600; padding-right:8px; }
.hm-cell { flex:1; height:24px; min-width:24px; border-radius:2px; }

/* ─── Modal ─── */
.modal { display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.45); backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:14px; }
.modal.on { display:flex; }
.modal-box { background:var(--paper); border-radius:12px; padding:20px; max-width:500px; width:100%; max-height:90vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); }
.modal-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--line); }

/* ─── Empty ─── */
.empty { text-align:center; padding:60px 20px; color:var(--sub); }
.empty .ico { font-size:48px; margin-bottom:14px; opacity:.4; }

/* Toast */
.toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:300; padding:10px 18px; border-radius:8px; background:var(--text); color:white; display:none; }
.toast.on { display:block; }

@media (max-width:768px) {
  .sidebar { width:60px; }
  .sb-name, .sb-sub, .sb-uname, .sb-urole, .sb-item span:not(.sb-icon) { display:none; }
  .sb-item { justify-content:center; padding:11px 0; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';
/* Same data structures as PROTOTYPE-CLAUDE — just different UI */

var TEAMS = ['EK','SQ','QR','CHN','SU','AK','TR','JQ','KC','EY','TK','PG','WY','CHARTER','PVT','WK',
  'PORTER','PORTER_CW','ADMIN_DOC','ADMIN_PT','OFFICE',
  'LL','PORTER_LL','ADMIN_LL'];
var TEAM_LABELS = {EK:'Emirates',SQ:'Singapore',QR:'Qatar',CHN:'China',SU:'Aeroflot',AK:'AirAsia',TR:'Scoot',JQ:'Jetstar',KC:'Korean',EY:'Etihad',TK:'Turkish',PG:'Bangkok Air',WY:'Oman Air',CHARTER:'Charter',PVT:'Private',WK:'Saudia',
  PORTER:'Porter',PORTER_CW:'Porter Crewsign',ADMIN_DOC:'Admin Doc',ADMIN_PT:'Admin Porter',OFFICE:'Office',
  LL:'Lost & Found',PORTER_LL:'Porter LL',ADMIN_LL:'Admin LL'};

/* Department mapping: PSA = การโดยสาร, LL = ติดตามสัมภาระ */
var DEPT_LABELS = {ALL:'ทุกแผนก', PSA:'การโดยสาร (PSA)', LL:'ติดตามสัมภาระ (LL)'};
var TEAM_DEPT = {LL:'LL', PORTER_LL:'LL', ADMIN_LL:'LL'}; // any team not in this map → PSA
function teamDept(t){return TEAM_DEPT[t] || 'PSA';}
function deptTeams(d){
  if (d === 'ALL') return TEAMS;
  if (d === 'LL') return ['LL'];

// raw → {code,cat,label,style}. Exact official first, else legacy migrate.
function normRole(raw){
  var s = String(raw||'').trim();
  if (!s) return {code:'-',cat:'Other',label:'-',style:ROLE_CAT_STYLE.Other};
  var hit = _ROLE_BY_U[s.toUpperCase()];
  if (!hit){
    var t = s.toUpperCase()
      .replace(/^(KC|OZ|KE|9C|CA|CZ|FM|3U|HX|MH|QR|EK|TR|JQ|TK|AK|QZ|8M|SV|WK|WY|SQ|EY|SU|PG|CX|HB|ZF|G9|6E|QP|IT|IX|AI|DE|OM|FY|UO)\b[\/\-]/,'');
    hit = _ROLE_BY_U[t];
    if (!hit){
      var prim = t.split(/[\/+]/)[0].trim().replace(/\(.*\)/,'').replace(/\s+\d+$/,'');
      var base = prim.replace(/\d+$/,'');
      var mc = ROLE_MIGRATE[t] || ROLE_MIGRATE[prim] || ROLE_MIGRATE[base];
      if (!mc){
        if (/^[FWJ]\d/.test(prim)) mc = prim[0]+'1/Prio';
        else if (/^WEB/.test(prim)) mc = 'WEB1';
        else if (/^[YHC]\d/.test(prim)) mc = 'Y1';
        else if (/^G\d|^G$/.test(prim)) mc = 'GA';
      }
      hit = mc ? _ROLE_BY_U[mc.toUpperCase()] : null;
    }
  }
  if (!hit) return {code:s,cat:'Other',label:s,style:ROLE_CAT_STYLE.Other};
  return {code:hit.c, cat:hit.cat, label:hit.th, style:ROLE_CAT_STYLE[hit.cat]||ROLE_CAT_STYLE.Other};
}

  if (info.kind==='LEAVE')return 'LEAVE';
  if (info.kind==='TRN')  return 'TRAINING';
  if (info.kind==='SWAP') return 'SWAP';
  return 'OTHER';
}

/* Stamp skills onto staff records (idempotent — only fills missing skills) */
function ensureSkills(){
  state.staff.forEach(function(s){
    if (!s.sk || !s.sk.length) s.sk = (TEAM_SKILLS[s.t] || ['EN']).slice();
    // Supervisors get extra certs
    if (s.p === 'SUP' && s.sk.indexOf('SUP-CERT') < 0) s.sk.push('SUP-CERT');
    if ((s.p === 'SUP' || s.p === 'SNR') && s.sk.indexOf('DGR') < 0) s.sk.push('DGR');
  });
}

/* Skill match score: how well a staff fits an airline */
function skillScore(staff, airline){
  var dcs = airlineDCS(airline);
  var sk = staff.sk || [];
  var score = 0;
  if (sk.indexOf(dcs) >= 0) score += 10;            // DCS match = highest
  if (sk.indexOf('EN') >= 0) score += 1;            // English baseline
  // Language match for region
  if (['CA','CZ','MU','HU','HO','FM','AQ','HX','3U','MF','GS','9C','SC'].indexOf(airline)>=0 && sk.indexOf('CN')>=0) score += 3;
  if (['SU','B2','W5','DV','OV'].indexOf(airline)>=0 && sk.indexOf('RU')>=0) score += 3;
  if (['EK','EY','QR','SV','WK','OM'].indexOf(airline)>=0 && sk.indexOf('AR')>=0) score += 3;
  if (['KE','KC','OZ','LJ'].indexOf(airline)>=0 && sk.indexOf('KR')>=0) score += 3;
  return score;
}

/* ── Check-In tracking — daily attendance ─────────────────────── */
/* Key: date|staffId → {at: timestamp, status: 'in'|'late'|'out'} */
function checkInKey(date, sid){return date+'|'+sid;}
function getCheckIn(date, sid){return (state.checkin || {})[checkInKey(date, sid)] || null;}
window.toggleCheckIn = function(date, sid){
  if (!state.checkin) state.checkin = {};
  var k = checkInKey(date, sid);
  if (state.checkin[k]) delete state.checkin[k];
  else {
    var now = new Date();
    var hh = p2(now.getHours()), mm = p2(now.getMinutes());
    state.checkin[k] = {at: hh+':'+mm, ts: Date.now(), status: 'in'};
  }
  lsSave(); render();
};

/* Look up shift code → returns {kind, in, out, hrs, isOT, isOff, isXxOt, isLeave, label}

   Thai law weekly threshold (>48 hrs/week) is checked separately in weeklyOTBreakdown. */
function lookupShift(code){
  if (!code) return null;
  if (SHIFT_DB.shifts[code]){
    var s = SHIFT_DB.shifts[code];
    return {kind:'WORK', in:s.i, out:s.o, hrs:s.h, isOT:s.h>8, isOff:false, isXxOt:false, isLeave:false, label:code+' '+s.i+'-'+s.o};

    return {
      kind: sp.t,
      in: null, out: null, hrs: 0, isOT: false,
      isOff: sp.t === 'OFF',
      isXxOt: sp.t === 'OT',     // XX = OT off
      isLeave: sp.t === 'LEAVE',
      label: sp.l
    };
  }
  // Real rosters (LL dept, the manual passenger files) write the schedule
  // as a time range "HHMM-HHMM" / "HH-HH" (e.g. 1000-1900, 05-14) or a
  // word (OFF/VAC/SICK). Parse those too so the engine sees a real shift.
  var raw = String(code).trim();
  var up = raw.toUpperCase();
  if (/^(OFF|DAYOFF|DO|X)$/.test(up))
    return {kind:'OFF', in:null, out:null, hrs:0, isOT:false, isOff:true, isXxOt:false, isLeave:false, label:'Off'};
  if (/^(VAC|VACATION|SICK|SICKED|SL|BL|AL|LEAVE|MATERNITY|ML)$/.test(up))
    return {kind:'LEAVE', in:null, out:null, hrs:0, isOT:false, isOff:false, isXxOt:false, isLeave:true, label:up};
  var rng = up.match(/^(\d{1,2})(\d{2})?\s*[-–]\s*(\d{1,2})(\d{2})?$/);
  if (rng){
    var ih = +rng[1], im = rng[2]!=null ? +rng[2] : 0;
    var oh = +rng[3], om = rng[4]!=null ? +rng[4] : 0;
    if (ih<=24 && oh<=24 && im<60 && om<60){
      var smin = ih*60+im, emin = oh*60+om;
      var dur = emin - smin; if (dur <= 0) dur += 1440;   // overnight
      var hrs = Math.round(dur/60*10)/10;
      function p2x(n){return (n<10?'0':'')+n;}
      var iS = p2x(ih%24)+':'+p2x(im), oS = p2x(oh%24)+':'+p2x(om);
      return {kind:'WORK', in:iS, out:oS, hrs:hrs, isOT:hrs>8, isOff:false, isXxOt:false, isLeave:false, label:raw+' ('+hrs+'h)'};
    }
  }
  return {kind:'UNKNOWN', isOff:false, isXxOt:false, isLeave:false, label:code};
}

/* staffStatus(date) — returns combined status flags per spec:
   isOff (day off X) · isXxOt (XX OT-off) · isWorking · isOnLeave · noAssignment
   "no assignment AND shift=OFF/empty → isOff=true"
   "shift=XX → isXxOt=true (separate, NOT working, NOT regular off)" */
function staffStatus(staffId, team, dateStr){
  var k = team+'-'+dateStr+'-'+staffId;
  var sc = state.roster[k];
  var info = lookupShift(sc);
  // Has any flight assignment that day?
  var prefix = team+'-'+dateStr+'-';
  var hasAsn = Object.keys(state.assignments||{}).some(function(key){
    if (key.indexOf(prefix) !== 0) return false;
    var fa = state.assignments[key]||{};
    return Object.keys(fa).some(function(r){return (fa[r]||[]).indexOf(staffId)>=0;});
  });
  if (!info){
    // No shift code AND no assignment = treated as off
    return {isOff: !hasAsn, isXxOt:false, isWorking: hasAsn, isOnLeave:false, noAssignment:!hasAsn, code:'', hrs:0};
  }
  return {
    isOff:        info.kind === 'OFF',
    isXxOt:       info.kind === 'OT',     // XX flag
    isWorking:    info.kind === 'WORK',
    isOnLeave:    info.kind === 'LEAVE',
    noAssignment: !hasAsn && info.kind !== 'WORK',
    code:         sc || '',
    hrs:          info.hrs || 0
  };
}

/* Compute total + OT hours per week (Thai threshold: >48 hrs = OT) */
function weekStats(staffId, team, monthDate){
  var d = new Date(monthDate), y = d.getFullYear(), m = d.getMonth();
  var days = new Date(y, m+1, 0).getDate();
  var total = 0, otShifts = 0, otHours = 0, workDays = 0, offDays = 0, leaveDays = 0;
  for (var dy=1; dy<=days; dy++){
    var ds = y+'-'+p2(m+1)+'-'+p2(dy);
    var k = team+'-'+ds+'-'+staffId;
    var c = state.roster[k];
    var info = lookupShift(c);
    if (!info) continue;
    if (info.kind === 'WORK'){
      total += info.hrs;
      workDays++;
      if (info.isOT) otShifts++;
      // OT hours = anything beyond 8 hrs in a single shift
      if (info.hrs > 8) otHours += (info.hrs - 8);
    }
    else if (info.kind === 'OFF') offDays++;
    else if (info.kind === 'LEAVE') leaveDays++;
  }
  return {total:total, otShifts:otShifts, otHours:otHours, workDays:workDays, offDays:offDays, leaveDays:leaveDays};
}

/* Weekly OT breakdown — Thai labor law: OT max 36 hrs/week
   Returns array of weeks with {start, otHours, totalHours, workDays, violation} */
function weeklyOTBreakdown(staffId, team, monthDate){
  var d = new Date(monthDate), y = d.getFullYear(), m = d.getMonth();
  var days = new Date(y, m+1, 0).getDate();
  var weekMap = {};
  for (var dy=1; dy<=days; dy++){
    var dt = new Date(y, m, dy);
    var ds = y+'-'+p2(m+1)+'-'+p2(dy);
    // Monday-of-week key (ISO week start)
    var dow = dt.getDay() || 7;
    var monday = new Date(dt);
    monday.setDate(dt.getDate() - (dow - 1));
    var wkKey = monday.getFullYear()+'-'+p2(monday.getMonth()+1)+'-'+p2(monday.getDate());
    if (!weekMap[wkKey]) weekMap[wkKey] = {start:wkKey, otHours:0, totalHours:0, workDays:0};
    var info = lookupShift(state.roster[team+'-'+ds+'-'+staffId]);
    if (info && info.kind === 'WORK'){
      weekMap[wkKey].totalHours += info.hrs;
      weekMap[wkKey].workDays++;
      if (info.hrs > 8) weekMap[wkKey].otHours += (info.hrs - 8);
    }
  }
  var weeks = Object.keys(weekMap).sort().map(function(k){
    var w = weekMap[k];
    // OT violation: per-shift OT hours > 36/week (มาตรา 26)
    w.violation = w.otHours > 36;
    w.warn = w.otHours > 30 && w.otHours <= 36;
    // Thai labor law: total work hours per week > 48 = additional flag
    w.exceeds48 = w.totalHours > 48;
    return w;
  });
  return weeks;
}

/* Aggregate: max weekly OT for staff, count of violation weeks */
function staffOTSummary(staffId, team, monthDate){
  var weeks = weeklyOTBreakdown(staffId, team, monthDate);
  var maxOT = 0, maxTotal = 0, violations = 0, warns = 0, exceeds48 = 0;
  weeks.forEach(function(w){
    if (w.otHours > maxOT) maxOT = w.otHours;
    if (w.totalHours > maxTotal) maxTotal = w.totalHours;
    if (w.violation) violations++;
    if (w.warn) warns++;
    if (w.exceeds48) exceeds48++;
  });
  return {maxOT:maxOT, maxTotal:maxTotal, violations:violations, warns:warns, exceeds48:exceeds48, weeks:weeks};
}

/* ── Sort infrastructure ─────────────────────────────────────── */
var POS_RANK = {SUP:0, SNR:1, PSA:2};

/* default sort spec per view (col + dir + tie-breakers) */
var SORT_DEFAULTS = {
  master:    {col:'p',  dir:1, tie:['t','n']},   // SUP→SNR→PSA, then team, then name
  dashboard: {col:'t',  dir:1, tie:[]},
  gap:      {col:'tm', dir:1, tie:['flight']},
  rosterStaff: {col:'p', dir:1, tie:['n']}
};

function getSort(view){
  if (!state.sort) state.sort = {};
  if (!state.sort[view]) {
    var d = SORT_DEFAULTS[view] || {col:null, dir:1, tie:[]};
    state.sort[view] = {col:d.col, dir:d.dir};
  }
  return state.sort[view];
}

window.sortTbl = function(view, col){
  var s = getSort(view);
  if (s.col === col) s.dir = -s.dir || -1;
  else { s.col = col; s.dir = 1; }
  render();
};

/* Returns sortable <th> markup with arrow indicator. opts: {right:true} */
function sortTh(view, col, label, opts){
  opts = opts || {};
  var s = getSort(view);
  var arrow = s.col === col ? (s.dir === 1 ? '▲' : '▼') : '↕';
  var color = s.col === col ? 'var(--brand)' : 'var(--line2)';
  var align = opts.right ? 'text-align:right;' : '';
  return '<th class="th-sort" style="cursor:pointer;'+align+'user-select:none;white-space:nowrap" onclick="sortTbl(\''+view+'\',\''+col+'\')" title="คลิกเพื่อเรียง">'+label+' <span style="color:'+color+';font-size:10px;margin-left:2px">'+arrow+'</span></th>';
}

/* Generic sort by accessors map (returns NEW array). cols defaults from SORT_DEFAULTS */
function applySort(arr, view, accessors){
  var s = getSort(view);
  var def = SORT_DEFAULTS[view] || {tie:[]};
  var keys = [s.col].concat(def.tie || []).filter(function(x){return x;});
  function getVal(row, k){ var fn = accessors[k]; return fn ? fn(row) : row[k]; }
  return arr.slice().sort(function(a,b){
    for (var i=0;i<keys.length;i++){
      var k = keys[i], va = getVal(a,k), vb = getVal(b,k);
      if (va === vb) continue;
      // primary key honors dir, tie-breakers always ascending
      var d = i === 0 ? s.dir : 1;
      if (va == null) return 1;
      if (vb == null) return -1;
      return va < vb ? -1*d : 1*d;
    }
    return 0;
  });
}

/* 17-team distinct color palette (tested for AA contrast on white) */
var TEAM_COLOR = {

  SQ:'#0ea5e9',      // Singapore — sky blue
  QR:'#6d28d9',      // Qatar — purple

  CHARTER:'#9333ea', // Charter — violet
  PVT:'#475569',     // Private — slate
  WK:'#166534',      // Saudia — dark green
  LL:'#64748b'       // Lost & Found — gray
};
function teamColor(t){ return TEAM_COLOR[t] || '#64748b'; }

window.setGanttSort = function(mode){ state.ganttSort = mode; render(); };

function renderGantt(date){
  var todayFlights = state.flights.filter(function(f){return f.flight_date===date;});
  if (!todayFlights.length) return '';
  var sortMode = state.ganttSort || 'time-asc';

  // Hour markers + grid lines (every 2h)
  var hourLabels = '', gridLines = '';
  for (var h=0;h<=24;h+=2){
    var lp = (h/24)*100;
    hourLabels += '<div class="g-h" style="left:'+lp+'%">'+(h<10?'0':'')+h+':00</div>';
    if (h>0 && h<24) gridLines += '<div class="g-grid" style="left:'+lp+'%"></div>';
  }
  // NOW line (only if viewing today)
  var nowLine = '';
  var todayIso = isoDate(new Date());
  if (date === todayIso){
    var nm = new Date();
    var minNow = nm.getHours()*60 + nm.getMinutes();
    var nlp = (minNow/(24*60))*100;
    nowLine = '<div class="g-now" style="left:'+nlp.toFixed(2)+'%"></div>';
  }

  // Helper to build one bar's HTML given a flight
  function barHtml(f){
    var sop = getSOP(f.airline);
    var tlb = computeTL(f);
    if (!tlb) return '';
    var brief = tlb.brief, end = tlb.post;
    var s = Math.max(0, brief), e = Math.min(24*60, end);
    var leftPct = (s/(24*60))*100;
    var widthPct = ((e-s)/(24*60))*100;
    var key = f.team+'-'+date+'-'+f.id;
    var fa = state.assignments[key]||{};
    var asn = 0;
    Object.keys(fa).forEach(function(r){asn += (fa[r]||[]).filter(function(x){return x;}).length;});
    var cov = sop.total ? asn/sop.total : 0;
    var col = teamColor(f.team);
    // coverage indicator: solid color when full; striped/dim when partial; outlined when empty
    var styleExtra = '';
    var statusIcon = '';
    if (cov >= 1) { styleExtra = 'background:'+col+';'; statusIcon = '✓'; }
    else if (cov >= 0.5) { styleExtra = 'background:repeating-linear-gradient(45deg,'+col+',' +col+' 6px,'+col+'cc 6px,'+col+'cc 12px);'; statusIcon = '◐'; }
    else if (cov > 0) { styleExtra = 'background:'+col+'40;border:1.5px solid '+col+';color:'+col+';'; statusIcon = '◔'; }
    else { styleExtra = 'background:transparent;border:1.5px dashed '+col+';color:'+col+';'; statusIcon = '○'; }
    var label = statusIcon + ' ' + (f.airline?f.airline+' ':'') + f.flight_no + ' ' + f.dep_time;
    var tip = f.flight_no + ' · ' + f.airline + ' · ' + f.team + ' · ' + f.dep_time + ' · ' + f.from + '→' + f.to + ' · ' + asn + '/' + sop.total + ' staffed';
    return '<div class="g-bar" style="left:'+leftPct.toFixed(2)+'%;width:'+Math.max(widthPct,1).toFixed(2)+'%;'+styleExtra+'" title="'+esc(tip)+'" onclick="state.team=\''+esc(f.team)+'\';state.view=\'daily\';render()">'+esc(label)+'</div>';
  }

  var bodyHtml;
  if (sortMode === 'team'){
    // Group by team, team order = earliest flight first
    var byTeam = {}, teamOrder = [];
    todayFlights.slice().sort(function(a,b){return pt(a.dep_time)-pt(b.dep_time);}).forEach(function(f){
      if (!byTeam[f.team]){ byTeam[f.team] = []; teamOrder.push(f.team); }
      byTeam[f.team].push(f);
    });
    bodyHtml = teamOrder.map(function(t){
      var bars = byTeam[t].map(barHtml).join('');
      var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+teamColor(t)+';margin-right:6px;vertical-align:0"></span>';
      return '<div class="g-row"><div class="g-lab">'+dot+esc(t)+'<span class="g-cnt">'+byTeam[t].length+'</span></div><div class="g-track">'+gridLines+nowLine+bars+'</div></div>';
    }).join('');
  } else {
    // sortMode = 'time-asc' or 'time-desc' → STAIRCASE: one flight per row, sorted by departure time
    var sorted = todayFlights.slice().sort(function(a,b){
      var d = pt(a.dep_time) - pt(b.dep_time);
      if (d !== 0) return sortMode === 'time-desc' ? -d : d;
      return a.flight_no < b.flight_no ? -1 : 1;
    });
    bodyHtml = sorted.map(function(f){
      var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+teamColor(f.team)+';margin-right:5px;vertical-align:0"></span>';
      var label = dot + '<span class="mono" style="font-size:10px">'+esc(f.dep_time)+'</span> <span style="color:'+teamColor(f.team)+';font-size:9px;font-weight:700">'+esc(f.airline)+'</span> <b style="font-size:10px">'+esc(f.flight_no)+'</b>';
      return '<div class="g-row g-stair"><div class="g-lab g-lab-stair">'+label+'</div><div class="g-track">'+gridLines+nowLine+barHtml(f)+'</div></div>';
    }).join('');
  }

  // Sort toggle UI
  function sBtn(mode, label){
    var on = sortMode === mode;
    return '<button class="btn '+(on?'btn-primary':'btn-secondary')+' btn-sm" onclick="setGanttSort(\''+mode+'\')">'+label+'</button>';
  }

  return '<div class="card" style="margin-bottom:14px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px">'+
      '<h3 style="font-size:15px">📊 Gantt — Flight Density (24h Timeline)</h3>'+
      '<div style="display:flex;gap:6px;align-items:center">'+
        '<span style="font-size:11px;color:var(--sub);margin-right:4px">Sort:</span>'+
        sBtn('team','By Team')+
        sBtn('time-asc','By Time ↑')+
        sBtn('time-desc','By Time ↓')+
      '</div>'+
    '</div>'+
    '<div style="font-size:11px;color:var(--sub);margin-bottom:8px">'+todayFlights.length+' flights · color = team identity · pattern = staffing coverage'+(sortMode!=='team'?' · staircase view (one flight per row)':'')+'</div>'+
    '<div class="g-wrap'+(sortMode!=='team'?' g-wrap-stair':'')+'">'+
      '<div class="g-hours">'+hourLabels+'</div>'+
      bodyHtml+
    '</div>'+
    '<div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--sub);flex-wrap:wrap;align-items:center">'+
      '<span style="font-weight:600;color:var(--text)">Coverage:</span>'+
      '<span><span style="display:inline-block;width:18px;height:10px;background:#0d9488;border-radius:2px;vertical-align:-1px;margin-right:4px"></span>✓ Full</span>'+
      '<span><span style="display:inline-block;width:18px;height:10px;background:repeating-linear-gradient(45deg,#0d9488,#0d9488 4px,#0d9488cc 4px,#0d9488cc 8px);border-radius:2px;vertical-align:-1px;margin-right:4px"></span>◐ Partial</span>'+
      '<span><span style="display:inline-block;width:18px;height:10px;background:#0d948840;border:1.5px solid #0d9488;border-radius:2px;vertical-align:-1px;margin-right:4px"></span>◔ &lt;50%</span>'+
      '<span><span style="display:inline-block;width:18px;height:10px;background:transparent;border:1.5px dashed #0d9488;border-radius:2px;vertical-align:-1px;margin-right:4px"></span>○ Empty</span>'+
      '<span style="margin-left:auto">💡 Click bar → Daily Ops</span>'+
    '</div>'+
    // Team color legend
    '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:10px">'+
      Object.keys(TEAM_COLOR).map(function(t){return '<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 6px;background:'+TEAM_COLOR[t]+'15;border-radius:4px"><span style="width:8px;height:8px;border-radius:50%;background:'+TEAM_COLOR[t]+'"></span><span style="color:'+TEAM_COLOR[t]+';font-weight:600">'+t+'</span></span>';}).join('')+
    '</div>'+
  '</div>';
}

/* SUP→SNR→PSA→team→name helper used wherever staff is listed */
function sortStaff(arr){
  return arr.slice().sort(function(a,b){
    var pa = POS_RANK[a.p] != null ? POS_RANK[a.p] : 99;
    var pb = POS_RANK[b.p] != null ? POS_RANK[b.p] : 99;
    if (pa !== pb) return pa - pb;
    if (a.t !== b.t) return a.t < b.t ? -1 : 1;
    if (a.n !== b.n) return a.n < b.n ? -1 : 1;
    return 0;
  });
}

/* ══ Apps Script Bridge — write-through via google.script.run ══
   The page is served BY the Apps Script web app (HtmlService), so
   google.script.run calls server functions in the user's own session —
   Session.getActiveUser() resolves, the per-user write gate works, and
   there is no cross-origin fetch (which silently drops identity).
   Single hook: lsSave() → scheduleApiSync() diffs state.assignments
   against state._synced and pushes per-slot upsert/delete. Bootstrap
   pulls staff+flights+assignments on load; a 10s poll merges others'
   edits. localStorage stays as the offline cache. If the file is opened
   directly (no google.script.run) the app runs local-only. */
var API_URL = 'https://script.google.com/macros/s/AKfycbzYywO4vmx4QqeHnleeUzUNWiTfVatfGjIB1VoegHVJegQBx3XpFhIs7fDujfryCeyhuw/exec';
function gsAvailable(){ return typeof google!=='undefined' && google.script && google.script.run; }
function gsRun(name){
  var args = [].slice.call(arguments, 1);
  return new Promise(function(resolve, reject){
    if (!gsAvailable()){ reject(new Error('not served by Apps Script (open via the web-app URL)')); return; }
    var runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function(err){ reject(new Error(err && err.message ? err.message : String(err))); });
    runner[name].apply(runner, args);
  });
}

async function apiBootstrap(){
  if (!state._apiOn) return;
  setApiPill('⏳ syncing…', '#b58900');
  try {
    var d = await gsRun('bootstrapData', state.date);
    if (d.error) throw new Error(d.error);
    if (Array.isArray(d.staff) && d.staff.length) state.staff = d.staff.map(function(s){ return Object.assign({sk:[]}, s); });
    if (Array.isArray(d.flights) && d.flights.length){
      state.flights = d.flights.map(function(f,i){ return Object.assign({bay:'',gate:'',aircraft:'',pax:0}, f, {id:i+1}); });
    }
    state.canWrite = !!d.canWrite;
    var srv = d.assignments || {};
    // translate server keys (team-date-flightno) → html keys (team-date-id)
    var translated = {};
    state.flights.forEach(function(f){ if (srv[srvKeyOf(f)]) translated[htmlKeyOf(f)] = srv[srvKeyOf(f)]; });
    // keep assignments for other dates, replace current date's set
    Object.keys(state.assignments).forEach(function(K){
      var fk = flightByHtmlKey(K);
      if (fk && fk.flight_date === state.date) delete state.assignments[K];
    });
    Object.keys(translated).forEach(function(K){ state.assignments[K] = translated[K]; });
    state._synced = deepCopy(state.assignments);
    if (d.roster && typeof d.roster === 'object'){
      state.roster = d.roster;
      state._syncedRoster = deepCopy(state.roster);
    }
    ensureSkills();
    _lsSaveCore(); render();
    setApiPill((state.canWrite?'🟢 live · can edit':'🔵 live · read-only'), state.canWrite?'#2e7d32':'#1565c0');
  } catch(e){
    state._apiOn = false;
    setApiPill('🔴 offline (local only)', '#c62828');
    toast('Bridge offline — '+e.message+' · using local cache');
  }
}

function scheduleRosterSync(){

}

// Diff state.roster vs last server snapshot → write changed/cleared cells
// to the Roster DB tab. Runs debounced from lsSave(); deletions send code:''
async function pushRosterDiff(){
  state._rosterTimer = null;
  if (state._rosterPushing || !state._apiOn || !state.canWrite) return;
  var cells = [];
  var keys = {};
  Object.keys(state.roster).forEach(function(k){keys[k]=1;});
  Object.keys(state._syncedRoster).forEach(function(k){keys[k]=1;});
  Object.keys(keys).forEach(function(k){
    var cur = state.roster[k] || '';
    var prev = state._syncedRoster[k] || '';
    if (cur !== prev) cells.push({key:k, code:cur, prev:prev});   // prev = base for conflict check
  });
  if (!cells.length) return;
  state._rosterPushing = true;
  setApiPill('⏳ saving roster '+cells.length+'…', '#b58900');
  try {
    var snapshot = deepCopy(state.roster);
    var d = await gsRun('saveRoster', {cells:cells});
    if (d && d.error) throw new Error(d.error);
    state._syncedRoster = snapshot;
    // Optimistic-concurrency: server rejects a cell whose base no longer
    // matches (someone else changed it). Adopt the server's value so we
    // don't keep clobbering and the user sees the latest.
    var conf = (d && d.conflicts) || [];
    if (conf.length){
      conf.forEach(function(c){
        state.roster[c.key] = c.serverCode || '';
        state._syncedRoster[c.key] = c.serverCode || '';
        if (!c.serverCode){ delete state.roster[c.key]; delete state._syncedRoster[c.key]; }
      });
      lsSave();
      render();
      toast('⚠ '+conf.length+' เซลล์ถูกแก้โดยคนอื่น — ใช้ค่าล่าสุดจาก server');
    }
    setApiPill('🟢 saved · can edit', '#2e7d32');
  } catch(e){
    setApiPill('🟠 roster save failed — retry', '#ef6c00');
    toast('Roster save failed: '+e.message);
  } finally { state._rosterPushing = false; }
}

async function apiPost(body){

  return d;
}

async function pushAssignmentDiff(){
  if (state._pushing || !state._apiOn || !state.canWrite) return;
  state._pushing = true;
  var ops = [];
  var keys = {}; Object.keys(state.assignments).forEach(function(k){keys[k]=1;}); Object.keys(state._synced).forEach(function(k){keys[k]=1;});
  Object.keys(keys).forEach(function(K){
    var f = flightByHtmlKey(K); if (!f) return;
    var cur = state.assignments[K]||{}, prev = state._synced[K]||{};
    var roles = {}; Object.keys(cur).forEach(function(r){roles[r]=1;}); Object.keys(prev).forEach(function(r){roles[r]=1;});
    Object.keys(roles).forEach(function(R){
      var ca = cur[R]||[], pa = prev[R]||[], n = Math.max(ca.length, pa.length);
      for (var s=0;s<n;s++){
        var c = ca[s]||null, p = pa[s]||null;
        if (c === p) continue;
        if (c){ var st=findStaff(c);
          ops.push({action:'upsertAssignment', date:f.flight_date, team:f.team, flight:f.flight_no,
            role:R, slot:s, empId:c, empName:st?(st.n+' '+st.ln):'', fi:srvKeyOf(f)}); }
        else { ops.push({action:'deleteAssignment', date:f.flight_date, team:f.team, flight:f.flight_no, role:R, slot:s}); }
      }
    });
  });
  if (!ops.length){ state._pushing=false; return; }
  setApiPill('⏳ saving '+ops.length+'…', '#b58900');
  try {
    for (var i=0;i<ops.length;i++) await apiPost(ops[i]);
    state._synced = deepCopy(state.assignments);
    setApiPill('🟢 saved · can edit', '#2e7d32');
  } catch(e){
    setApiPill('🟠 save failed — retry', '#ef6c00');
    toast('Save failed: '+e.message);
  } finally { state._pushing = false; }
}

async function apiPoll(){
  if (!state._apiOn || state._pushing || state._syncTimer) return;
  if (document.querySelector('.modal')) return;   // don't clobber an open picker
  try {
    var d = await gsRun('pollAssignments', state.date);
    if (!d || d.error) return;
    var srv = d.assignments||{}, translated = {};
    state.flights.forEach(function(f){ if (srv[srvKeyOf(f)]) translated[htmlKeyOf(f)] = srv[srvKeyOf(f)]; });
    // only adopt if changed vs last synced snapshot for this date
    var curForDate = {};
    Object.keys(state._synced).forEach(function(K){ var f=flightByHtmlKey(K); if (f && f.flight_date===state.date) curForDate[K]=state._synced[K]; });
    if (JSON.stringify(translated) === JSON.stringify(curForDate)) return;
    Object.keys(state.assignments).forEach(function(K){ var f=flightByHtmlKey(K); if (f && f.flight_date===state.date) delete state.assignments[K]; });
    Object.keys(translated).forEach(function(K){ state.assignments[K]=translated[K]; });
    state._synced = deepCopy(state.assignments);
    _lsSaveCore(); render();
    toast('🔄 Updated from server');
  } catch(e){ /* transient — keep local */ }
}

// Auto-refresh flight schedule from the Flight sheet (no button press).
// Lighter + fault-tolerant: a transient failure does NOT disable the
// bridge (unlike apiBootstrap). Runs on an interval from init().
async function apiRefreshFlights(){
  if (!state._apiOn || state._pushing || state._syncTimer) return;
  if (document.querySelector('.modal')) return;   // don't disrupt an open picker
  try {
    var d = await gsRun('bootstrapData', state.date);
    if (!d || d.error) return;
    // adopt others' roster edits (skip if we have unsynced local roster edits)
    if (d.roster && typeof d.roster === 'object' && !state._rosterTimer && !state._rosterPushing
        && JSON.stringify(d.roster) !== JSON.stringify(state._syncedRoster)){
      state.roster = d.roster;
      state._syncedRoster = deepCopy(d.roster);
      _lsSaveCore(); render();
      toast('🔄 Roster updated from server');
    }
    if (!Array.isArray(d.flights) || !d.flights.length) return;
    var mapped = d.flights.map(function(f,i){ return Object.assign({bay:'',gate:'',aircraft:'',pax:0}, f, {id:i+1}); });
    if (JSON.stringify(mapped) === JSON.stringify(state.flights)) return;   // no change
    state.flights = mapped;
    if (typeof d.canWrite === 'boolean') state.canWrite = d.canWrite;
    var srv = d.assignments || {}, translated = {};
    state.flights.forEach(function(f){ if (srv[srvKeyOf(f)]) translated[htmlKeyOf(f)] = srv[srvKeyOf(f)]; });
    Object.keys(state.assignments).forEach(function(K){ var fk=flightByHtmlKey(K); if (fk && fk.flight_date===state.date) delete state.assignments[K]; });
    Object.keys(translated).forEach(function(K){ state.assignments[K] = translated[K]; });
    state._synced = deepCopy(state.assignments);
    _lsSaveCore(); render();
    toast('🔄 Flights updated from server');
  } catch(e){ /* transient — keep local, retry next tick */ }
}

function isoDate(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function p2(n){return n<10?'0'+n:''+n;}
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pt(t){if(!t)return null;var m=String(t).match(/(\d{1,2})[:.](\d{2})/);return m?parseInt(m[1])*60+parseInt(m[2]):null;}
function fm(min){if(min==null)return'--:--';var v=((min%1440)+1440)%1440;return p2(Math.floor(v/60))+':'+p2(v%60);}
function getSLAraw(a){return SLA[a]||SLA.DEFAULT;}
/* CT/G covers GATE: when an SLA defines a CT/G role, the check-in CT/G
   staffing also works the gate, so GA/GATE slots are absorbed (not a
   separate requirement). Effective roles/total drop GA/GATE so gap,
   coverage %, dashboard and the worksheet never inflate. Timing fields
   (ci/cc/go/brief/post) are untouched — computeTL uses getSLAraw. */
/* SLA roles are the TRUE required headcount, gate included. Whether a
   person works check-in only, gate only, or CT/G (both) is decided at
   assignment time (solveDay) by how many team staff remain — not by
   pre-dropping gate. Identity passthrough so gap/coverage/support/auto
   all see the real role set. */
function slaEffective(sla){ return sla; }
function _hasCTG(sla){
  return !!(sla && sla.roles && sla.roles.some(function(r){
    return arBaseCode(r.length>=3?r[2]:r[0])==='CT/G';
  }));
}
function _isGateCode(code){ var b=arBaseCode(code); return b==='GA'||b==='GATE'; }
function getSOP(a){return slaEffective(getSLAraw(a));}
function getSLA(a){return slaEffective(getSLAraw(a));}
function getStaffByTeam(t){return state.staff.filter(function(s){return (t==='ALL'||s.t===t) && s.active && inDept(s);});}
function findStaff(id){return state.staff.find(function(s){return s.i===id;});}
function toast(m){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2500);}

function computeTL(f){
  var s=getSLAraw(f.airline),std=pt(f.dep_time);
  if(std==null)return null;
  // Support both old (open/close/gate) and new (ci/cc/go) field names
  var ci=s.ci!=null?s.ci:s.open, cc=s.cc!=null?s.cc:s.close, go=s.go!=null?s.go:s.gate;
  return {brief:std+ci-s.brief, open:std+ci, close:std+cc, gate:std+go, std:std, post:std+s.post};
}

/* Solver — same v13 logic */
function solveDay(team, date) {
  var flights = state.flights.filter(function(f){return f.flight_date===date && (team==='ALL'||f.team===team);});
  var pool = state.staff.filter(function(s){return s.active && ['SUP','SNR','PSA'].indexOf(s.p) >= 0;});
  var sorted = flights.slice().sort(function(a,b){var t1=computeTL(a),t2=computeTL(b);return (t1?t1.brief:0)-(t2?t2.brief:0);});
  var busy = {};
  var asn = []; var viol = [];
  function isBusy(id, s, e){var w=busy[id]||[];return w.some(function(x){return s<x.end&&e>x.start;});}
  function lock(id,s,e){if(!busy[id])busy[id]=[];busy[id].push({start:s,end:e});}
  // Staff must be on a WORK shift that day (OFF / leave / no-shift are
  // excluded) whose window — widened by OT_EXT_MIN each side for OT
  // before/after — FULLY spans the flight's [brief,post]. The old
  // ≥60-min-overlap escape let a 04:00-16:00 person staff a 22:45
  // flight, which is why assignments looked nonsensical; require real
  // presence for the whole flight instead.
  function shiftOK(s, brief, end){
    var sw = arShiftWindow(s.i, s.t, date);
    if (!sw) return false;
    var beforeExt = sw.otb==null ? OT_EXT_MIN : sw.otb;
    var afterExt  = sw.ota==null ? OT_EXT_MIN : sw.ota;
    return (sw.s - beforeExt) <= brief && (sw.e + afterExt) >= end;
  }
  // Weekly-OT lookup (memoized) — used to balance load so the engine
  // prefers staff with the LEAST OT this month (keeps people ≤36h/wk).
  var _otCache = {};
  function otOf(s){
    if (_otCache[s.i] == null){
      try { _otCache[s.i] = staffOTSummary(s.i, s.t, date).maxOT || 0; }
      catch(e){ _otCache[s.i] = 0; }
    }
    return _otCache[s.i];
  }
  // Per-day load — how many slots each person already holds across all
  // flights today. Used so roles (esp. SUP, which is not time-locked)
  // ROTATE across qualified staff instead of piling on one person.
  var loadCount = {};
  // Rank candidates: DCS/skill match for the airline → fewest slots so
  // far today (rotate) → least weekly OT (balance) → name.
  function rankCands(arr, airline){
    return arr.slice().sort(function(a,b){
      var sa = skillScore(a, airline), sb = skillScore(b, airline);
      if (sa !== sb) return sb - sa;
      var la = loadCount[a.i]||0, lb = loadCount[b.i]||0;
      if (la !== lb) return la - lb;
      var oa = otOf(a), ob = otOf(b);
      if (oa !== ob) return oa - ob;
      return a.n < b.n ? -1 : a.n > b.n ? 1 : 0;
    });
  }
  // Find a candidate for a role-code at a team — respect position eligibility,
  // shift coverage, no double-booking; rank by DCS skill + OT balance.
  // scope: 'home' own-team only · 'cross' other-teams only · else home→cross
  // ignoreBusy: supervisory roles (SUP) oversee the shift, not one flight,
  // so one SUP may cover several flights even with overlapping windows.
  function find(roleCode, t, brief, end, used, airline, scope, ignoreBusy) {
    function free(s){ return ignoreBusy || !isBusy(s.i,brief,end); }
    var posOrder = rolePosOrder(roleCode);
    if (scope !== 'cross') {
      for (var i=0;i<posOrder.length;i++){
        var p = posOrder[i];
        var home = pool.filter(function(s){return s.t===t && s.p===p && !used[s.i] && free(s) && shiftOK(s,brief,end);});
        if (home.length) return rankCands(home, airline)[0];
      }
    }
    if (scope !== 'home') {
      for (var j=0;j<posOrder.length;j++){
        var p2 = posOrder[j];
        var x = pool.filter(function(s){return s.t!==t && s.p===p2 && !used[s.i] && free(s) && shiftOK(s,brief,end);});
        if (x.length) return Object.assign({}, rankCands(x, airline)[0], {fromOther:true});
      }
    }
    return null;
  }
  sorted.forEach(function(f) {
    var sla = getSLA(f.airline);
    var tl = computeTL(f); if (!tl) return;
    var key = f.team+'-'+date+'-'+f.id;
    var used = {};
    // Drop stale assignments on staff who are OFF / on leave / not on a
    // shift covering this flight, then let the engine re-fill the freed
    // slots with valid people. Guard: only when roster data for this
    // team-date is actually loaded, so a failed roster fetch never wipes
    // the sheet (it would otherwise look like everyone is OFF).
    var rosterHasData = Object.keys(state.roster).some(function(rk){
      return rk.indexOf(f.team+'-'+date+'-')===0;
    });
    if (rosterHasData && state.assignments[key]) {
      Object.keys(state.assignments[key]).forEach(function(rc){
        var keep = (state.assignments[key][rc]||[]).filter(function(sid){
          if (!sid) return false;
          var st = findStaff(sid);
          return st && st.active && shiftOK(st, tl.brief, tl.post);
        });
        if (keep.length) state.assignments[key][rc] = keep;
        else delete state.assignments[key][rc];
      });
    }
    var existing = state.assignments[key] || {};
    Object.keys(existing).forEach(function(r){(existing[r]||[]).forEach(function(s){if(s){used[s]=true;lock(s,tl.brief,tl.post);}});});
    // Resolve role code — for new SLA (4-tuple) use index 2; for old (2-tuple) use index 0
    function roleCode(r){return r.length>=3 ? r[2] : r[0];}
    function roleKey(r){return roleCode(r);}   // store assignment under jobCode
    // CT/G is the normal model: a check-in person continues to the gate,
    // so a gate slot is filled FIRST by a CT/G holder on this flight
    // (dual). Only if every CT/G person is already doubled do we use a
    // fresh own-team gate agent, then a cross-team one. Enough CT/G
    // people → gate fully covered by them ("all CT/G").
    var hasCTG = _hasCTG(sla);
    var gateDoubled = {};
    function pickGateDouble(){
      var ids = [];
      Object.keys(existing).forEach(function(rc){
        if (arBaseCode(rc)==='CT/G') (existing[rc]||[]).forEach(function(s){if(s)ids.push(s);});
      });
      asn.forEach(function(a){
        if (a.key===key && arBaseCode(a.role)==='CT/G') ids.push(a.sid);
      });
      for (var n=0;n<ids.length;n++){
        if (gateDoubled[ids[n]]) continue;
        var st = pool.filter(function(s){return s.i===ids[n] && s.t===f.team;})[0];
        if (st) return st;
      }
      return null;
    }
    // STEP 1: SUP_ONLY + SNR_PLUS first (constrained), then OPEN_AGT
    function pass(filterFn){
      sla.roles.forEach(function(r){
        var code = roleCode(r);
        if (!filterFn(code)) return;
        var k = roleKey(r);
        var have = (existing[k]||[]).filter(function(x){return x;}).length;
        var need = r[1]-have;
        for (var i=0;i<need;i++){
          var c = null, dual = false;
          var isSup = ROLE_GROUP[code]==='SUP_ONLY';
          if (hasCTG && _isGateCode(code)) {
            var dbl = pickGateDouble();
            if (dbl){ c = dbl; dual = true; }
            if (!c) c = find(code, f.team, tl.brief, tl.post, used, f.airline, 'home');
            if (!c) c = find(code, f.team, tl.brief, tl.post, used, f.airline, 'cross');
          } else {
            c = find(code, f.team, tl.brief, tl.post, used, f.airline, undefined, isSup);
          }
          if (c){
            asn.push({key:key, role:k, sid:c.i});
            loadCount[c.i] = (loadCount[c.i]||0) + 1;   // rotate work fairly
            if (dual){ gateDoubled[c.i]=true; }     // already used+locked as CT/G — intentional double
            else if (isSup){ used[c.i]=true; }      // supervises across flights — no time-lock
            else { used[c.i]=true; lock(c.i,tl.brief,tl.post); }
          }
          else { viol.push({flight:f, role:k}); break; }
        }
      });
    }
    pass(function(c){return ROLE_GROUP[c]==='SUP_ONLY';});
    pass(function(c){return ROLE_GROUP[c]==='SNR_PLUS';});
    pass(function(c){return !ROLE_GROUP[c] || ROLE_GROUP[c]==='OPEN_AGT';});
  });
  asn.forEach(function(a){if(!state.assignments[a.key])state.assignments[a.key]={};if(!state.assignments[a.key][a.role])state.assignments[a.key][a.role]=[];state.assignments[a.key][a.role].push(a.sid);});
  lsSave();
  return {assigned:asn.length, violations:viol};
}

  if (state.dark) document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  dom.innerHTML = `
    <div class="app">

window.setDept = function(d){
  state.dept = d;
  // Reset team filter if it doesn't match new dept
  if (d !== 'ALL' && state.team !== 'ALL' && deptTeams(d).indexOf(state.team) < 0){
    state.team = 'ALL';
  }
  render();
};

// Change the working date and pull THAT date's flights+assignments from
// the DB — so assignments 3 days / 1 week ahead (and roster 1–3 months
// ahead) load live, not just whatever is in the local cache.

  if (!v) return;
  state.date = v;
  render();
  if (state._apiOn) apiBootstrap();
};

/* Filter staff by current department */
function inDept(staffOrTeam){
  if (state.dept === 'ALL') return true;
  var t = typeof staffOrTeam === 'string' ? staffOrTeam : staffOrTeam.t;
  return teamDept(t) === state.dept;
}

/* ── Dashboard ─── */
function renderDashboard() {
  var date = state.date;
  var todayFlights = state.flights.filter(function(f){return f.flight_date===date;});
  var active = state.staff.filter(function(s){return s.active && inDept(s);});
  var byPos = {SUP:0,SNR:0,PSA:0};
  active.forEach(function(s){byPos[s.p]=(byPos[s.p]||0)+1;});

  // Per-spec: split staff status for selected date — Working / OFF (X) / XX (OT off) / Leave / Pending
  var statusCount = {working:0, off:0, xxOt:0, leave:0, pending:0};
  active.forEach(function(s){
    var st = staffStatus(s.i, s.t, date);
    if (st.isWorking) statusCount.working++;
    else if (st.isXxOt) statusCount.xxOt++;
    else if (st.isLeave) statusCount.leave++;
    else if (st.isOff) statusCount.off++;
    else statusCount.pending++;
  });

  var asn = 0;
  Object.keys(state.assignments).forEach(function(k){
    if (k.indexOf('-'+date+'-')<0) return;
    var fa = state.assignments[k]||{};
    Object.keys(fa).forEach(function(r){asn += (fa[r]||[]).filter(function(x){return x;}).length;});
  });
  var totalReq = 0;
  todayFlights.forEach(function(f){totalReq += getSOP(f.airline).total;});
  var coverage = totalReq?Math.round(asn/totalReq*100):0;

  var teamRows = TEAMS.map(function(t){
    var fl = todayFlights.filter(function(f){return f.team===t;});
    var st = state.staff.filter(function(s){return s.t===t&&s.active;});
    var req=0,as=0;
    fl.forEach(function(f){
      req += getSOP(f.airline).total;
      var k = t+'-'+date+'-'+f.id;
      var fa = state.assignments[k]||{};
      Object.keys(fa).forEach(function(r){as += (fa[r]||[]).filter(function(x){return x;}).length;});
    });
    return {t:t, fl:fl.length, st:st.length, req:req, asn:as};
  }).filter(function(r){return r.fl>0||r.st>0;});

  return `
    <div class="phdr">
      <div><h2>📊 Dashboard</h2><div class="sub">Overview · ${esc(date)}</div></div>
      <div><input type="date" class="input" value="${date}" onchange="setDate(this.value);" style="width:auto"></div>
    </div>
    <div class="kpi">
      <div class="kpi-card"><div class="lbl">Active Staff</div><div class="val">${active.length}</div><div class="sub">SUP ${byPos.SUP} · SNR ${byPos.SNR} · PSA ${byPos.PSA}</div></div>
      <div class="kpi-card k-blue"><div class="lbl">Today's Flights</div><div class="val">${todayFlights.length}</div><div class="sub">${TEAMS.length} teams</div></div>
      <div class="kpi-card k-green"><div class="lbl">Assignments</div><div class="val">${asn}</div><div class="sub">/ ${totalReq} required</div></div>
      <div class="kpi-card k-amber"><div class="lbl">Coverage</div><div class="val">${coverage}%</div><div class="sub">of total slots</div></div>
    </div>
    <!-- Status breakdown per spec: Working / Off / XX (OT off) / Leave / Pending -->
    <div class="kpi" style="margin-bottom:14px">
      <div class="kpi-card k-green"><div class="lbl">🟢 Working</div><div class="val">${statusCount.working}</div><div class="sub">on flights</div></div>
      <div class="kpi-card"><div class="lbl">⬜ Off (X)</div><div class="val">${statusCount.off}</div><div class="sub">regular day off</div></div>
      <div class="kpi-card k-red"><div class="lbl">🔴 XX (OT Off)</div><div class="val">${statusCount.xxOt}</div><div class="sub">OT compensation off</div></div>
      <div class="kpi-card k-amber"><div class="lbl">🟡 Leave</div><div class="val">${statusCount.leave}</div><div class="sub">SL/BL/Vac/AL</div></div>
      <div class="kpi-card k-blue"><div class="lbl">⏳ Pending</div><div class="val">${statusCount.pending}</div><div class="sub">no shift code yet</div></div>
    </div>
    ${renderGantt(date)}
    <div class="card">
      <h3 style="margin-bottom:14px;font-size:15px">Team Overview</h3>
      <div class="tbl-wrap" style="border:none">
        <table class="tbl">
          <thead><tr>
            ${sortTh('dashboard','t','Team')}
            ${sortTh('dashboard','desc','Description')}
            ${sortTh('dashboard','fl','Flights',{right:true})}
            ${sortTh('dashboard','st','Staff',{right:true})}
            ${sortTh('dashboard','req','Required',{right:true})}
            ${sortTh('dashboard','asn','Assigned',{right:true})}
            ${sortTh('dashboard','cov','Coverage',{right:true})}
          </tr></thead>
          <tbody>${applySort(teamRows, 'dashboard', {
            t:    function(r){return r.t;},
            desc: function(r){return TEAM_LABELS[r.t];},
            fl:   function(r){return r.fl;},
            st:   function(r){return r.st;},
            req:  function(r){return r.req;},
            asn:  function(r){return r.asn;},
            cov:  function(r){return r.req?r.asn/r.req:0;}
          }).map(function(r){
            var pct = r.req?Math.round(r.asn/r.req*100):0;
            var cls = pct>=95?'badge-green':pct>=70?'badge-amber':'badge-red';
            return '<tr><td><span class="badge badge-brand">'+esc(r.t)+'</span></td><td style="color:var(--sub)">'+esc(TEAM_LABELS[r.t])+'</td><td style="text-align:right">'+r.fl+'</td><td style="text-align:right">'+r.st+'</td><td style="text-align:right">'+r.req+'</td><td style="text-align:right">'+r.asn+'</td><td style="text-align:right"><span class="badge '+cls+'">'+pct+'%</span></td></tr>';
          }).join('')}</tbody>
        </table>
      </div>
    </div>`;
}

/* ── OT Load — OT hours per person per day, per team (spec §5.2) ─── */
window.fetchManpowerOT = async function(){
  var from = document.getElementById('mpFrom').value;
  var to   = document.getElementById('mpTo').value;
  if (!from || !to){ toast('เลือกช่วงวันที่ก่อน'); return; }
  toast('กำลังอ่าน MANPOWER จาก Drive…');
  try {
    var d = await gsRun('importManpowerOT', {from:from, to:to});
    if (!d || d.error) throw new Error(d && d.error ? d.error : 'no response');
    state._manpowerOT = {summary:d.summary||{}, range:{from:from,to:to}, files:d.files||[], at:new Date().toISOString()};
    state.otSource = 'manpower';
    render();
    var okN = (d.files||[]).filter(function(f){return f.ok;}).length;
    toast('MANPOWER: '+d.teams+' ทีม · '+okN+' ไฟล์อ่านได้ · ครอบคลุม '+(d.daysCovered||0)+' แถว');
  } catch(e){
    toast('Import MANPOWER ล้มเหลว: '+e.message);
  }
};
function renderOTLoad(){
  var dd = new Date(state.date), y = dd.getFullYear(), m = dd.getMonth();
  var days = new Date(y, m+1, 0).getDate();
  var monLabel = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]+' '+y;
  var teams = deptTeams(state.dept).filter(function(t){return t!=='ALL';});
  var source = state.otSource || 'roster';
  var mp = state._manpowerOT;

  // Build rows depending on source
  var rows = [];
  if (source==='manpower' && mp && mp.summary){
    Object.keys(mp.summary).forEach(function(team){
      if (state.dept!=='ALL' && teamDept(team)!==state.dept) return;
      var s = mp.summary[team] || {ot:0,otHol:0,days:0};
      var staffN = getStaffByTeam(team).length;
      var totOT = s.ot + s.otHol;
      var denom = Math.max(1, staffN * Math.max(1, s.days));
      rows.push({team:team, staff:staffN, ot:Math.round(s.ot), otHol:Math.round(s.otHol),
        otTotal:Math.round(totOT), days:s.days, perDay: totOT/denom});
    });
  } else {
    teams.forEach(function(team){
      var staff = getStaffByTeam(team);
      if (!staff.length) return;
      var ot = 0;
      staff.forEach(function(s){
        for (var d=1; d<=days; d++){
          var iso = y+'-'+p2(m+1)+'-'+p2(d), kk = team+'-'+iso+'-'+s.i;
          var info = lookupShift(state.roster[kk]);
          if (info && info.kind==='WORK' && info.hrs>8) ot += (info.hrs-8);
          var ob = parseFloat(state.roster[kk+'|OTB']); if (!isNaN(ob)) ot += Math.max(0,ob);
          var oa = parseFloat(state.roster[kk+'|OTA']); if (!isNaN(oa)) ot += Math.max(0,oa);
        }
      });
      var perDay = ot / (staff.length * days);
      rows.push({team:team, staff:staff.length, ot:Math.round(ot), otHol:0, otTotal:Math.round(ot), days:days, perDay:perDay});
    });
  }
  rows.sort(function(a,b){return b.perDay-a.perDay;});
  function band(v){ return v>=6?{c:'#E24B4A',l:'วิกฤต ≥6'}:v>=2.5?{c:'#EF9F27',l:'สูง ≥2.5'}:v>=1.5?{c:'#FAC775',l:'กลาง 1.5-2.5'}:{c:'#9FE1CB',l:'ต่ำ <1.5'}; }
  var maxPd = Math.max(0.1, rows.reduce(function(a,r){return Math.max(a,r.perDay);},0));
  var totOT = rows.reduce(function(a,r){return a+r.otTotal;},0);
  var totHol = rows.reduce(function(a,r){return a+(r.otHol||0);},0);
  var crit = rows.filter(function(r){return r.perDay>=6;}).length;

  var mpRange = source==='manpower' && mp ? (mp.range.from+' → '+mp.range.to) : '';
  var srcBadge = source==='manpower'
    ? '<span class="badge badge-amber" style="margin-left:6px">MANPOWER · '+esc(mpRange)+'</span>'
    : '<span class="badge" style="margin-left:6px">Roster (คำนวณจากกะ)</span>';
  var defFrom = y+'-'+p2(m+1)+'-01', defTo = y+'-'+p2(m+1)+'-'+p2(days);
  var fromVal = mp ? mp.range.from : defFrom;
  var toVal   = mp ? mp.range.to   : defTo;

  var head = '<div class="phdr"><div><h2>⚡ OT Load — ชม. OT ต่อคนต่อวัน '+srcBadge+'</h2>'+
    '<div class="sub">'+esc(monLabel)+' · '+(state.dept==='ALL'?'ทุกแผนก':esc(DEPT_LABELS[state.dept]))+
    ' · รวม OT '+totOT.toLocaleString()+' ชม'+(totHol?(' (นักขัตฯ '+totHol.toLocaleString()+')'):'')+
    ' · '+(crit?('<span style="color:#E24B4A;font-weight:700">'+crit+' ทีมวิกฤต</span>'):'ไม่มีทีมวิกฤต')+'</div></div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+
      '<input type="date" class="input" id="mpFrom" value="'+fromVal+'" style="width:auto" title="วันเริ่ม MANPOWER">'+
      '<input type="date" class="input" id="mpTo" value="'+toVal+'" style="width:auto" title="วันสิ้นสุด MANPOWER">'+
      '<button class="btn btn-secondary btn-sm" onclick="fetchManpowerOT()" title="อ่าน OT จาก MANPOWER tab ของไฟล์ Assignment รายวันใน Drive">📥 อ่านจาก MANPOWER</button>'+
      (source==='manpower'?'<button class="btn btn-ghost btn-sm" onclick="state.otSource=\'roster\';render()" title="กลับไปคำนวณจากกะ">↺ จาก Roster</button>':'')+
      '<input type="date" class="input" value="'+state.date+'" onchange="setDate(this.value)" style="width:auto;margin-left:6px">'+
    '</div></div>';

  if (!rows.length) return head+'<div class="card"><div class="empty"><div class="ico">⚡</div><div>ไม่มีข้อมูล — '+(source==='manpower'?'กด 📥 อ่านจาก MANPOWER':'Import/Auto Fill roster ก่อน')+'</div></div></div>';

  var bars = rows.map(function(r){
    var bd = band(r.perDay), w = Math.max(2, r.perDay/maxPd*100);
    var split = (r.otHol>0 && r.otTotal>0) ? '<div style="position:absolute;left:0;top:0;width:'+w+'%;height:100%;border-radius:4px;display:flex;overflow:hidden">'+
        '<div style="flex:'+r.ot+';background:'+bd.c+';"></div>'+
        '<div style="flex:'+r.otHol+';background:#9b59b6;"></div></div>'
      : '<div style="width:'+w+'%;background:'+bd.c+';height:100%;border-radius:4px;min-width:2px"></div>';
    var detail = r.perDay.toFixed(2)+' ชม · OT '+r.otTotal.toLocaleString()+(r.otHol?(' (นักขัตฯ '+r.otHol+')'):'')+(source==='manpower'?(' · '+r.days+' วัน'):'');
    return '<div style="display:flex;align-items:center;gap:10px;margin:6px 0">'+
      '<div style="width:140px;font-size:12px;font-weight:700;text-align:right">'+esc(TEAM_LABELS[r.team]||r.team)+' <span style="color:var(--sub);font-weight:400">('+esc(r.team)+' · '+r.staff+')</span></div>'+
      '<div style="flex:1;background:var(--bg2);border-radius:4px;height:22px;position:relative">'+
        split+
        '<span style="position:absolute;left:8px;top:0;line-height:22px;font-size:11px;font-weight:700;color:#1a2b42">'+esc(detail)+'</span>'+
      '</div></div>';
  }).join('');
  var legend = '<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:11px;color:var(--sub)">'+
    [['#E24B4A','วิกฤต ≥6'],['#EF9F27','สูง ≥2.5'],['#FAC775','กลาง 1.5-2.5'],['#9FE1CB','ต่ำ <1.5'],['#9b59b6','OT นักขัตฯ']].map(function(x){
      return '<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:'+x[0]+'"></span>'+x[1]+'</span>';
    }).join('')+'</div>';
  var note = source==='manpower'
    ? 'จาก MANPOWER tab ของไฟล์ Assignment รายวัน (Drive) · OT รวม = OT ปกติ + OT นักขัตฯ ÷ คน × วันที่มีข้อมูล'
    : 'คำนวณจากกะ (กะ >8 ชม. ส่วนเกิน + OT ก่อน/หลังที่บันทึก) ÷ คน × วันในเดือน';
  return head+'<div class="card"><div style="font-size:12px;color:var(--sub);margin-bottom:10px">'+note+'</div>'+bars+legend+'</div>';
}

function renderDaily() {

  var mode = state.dailyView || 'day';
  var allFlights = state.flights.filter(function(f){return team==='ALL'||f.team===team;});

  function vBtn(m, label){
    var on = mode === m;
    return '<button class="btn '+(on?'btn-primary':'btn-secondary')+' btn-sm" onclick="setDailyView(\''+m+'\')">'+label+'</button>';
  }

  var header = `
    <div class="phdr">
      <div><h2>✈️ Daily Operations</h2><div class="sub">View flights by day / week / month</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${vBtn('day','📅 Day')}
        ${vBtn('week','📆 Week')}

          <option value="ALL"${team==='ALL'?' selected':''}>All Teams</option>
          ${deptTeams(state.dept).map(function(t){return '<option value="'+t+'"'+(team===t?' selected':'')+'>'+t+'</option>';}).join('')}
        </select>
        <input type="date" class="input" value="${date}" onchange="setDate(this.value);" style="width:auto">
        ${mode==='day' ? '<button class="btn btn-primary btn-sm" onclick="autoAssignAll()">⚡ Auto Assign</button><button class="btn btn-secondary btn-sm" onclick="clearDay()">Clear</button>' : ''}
      </div>
    </div>`;

  if (mode === 'day'){
    var flights = state.flights.filter(function(f){return f.flight_date===date && (team==='ALL'||f.team===team);}).sort(function(a,b){return pt(a.dep_time)-pt(b.dep_time);});
    // Determine all dates available in the dataset

    var emptyHtml = '<div class="empty" style="padding:24px"><div class="ico">✈️</div>'+
      '<div style="font-weight:700;margin-bottom:8px">No flights for '+esc(date)+(team!=='ALL'?' · team '+esc(team):'')+'</div>';
    if (state.driveSyncUrl){
      emptyHtml += '<div style="font-size:12px;color:var(--sub);margin-bottom:12px">ดึงข้อมูลล่าสุดจาก Google Drive ที่ลิงก์ไว้</div>'+
        '<button class="btn btn-primary btn-sm" onclick="syncFromDrive()">⚡ Sync Now from Drive</button>';
    } else {
      emptyHtml += '<div style="font-size:12px;color:var(--sub);margin-bottom:12px">ยังไม่ได้เชื่อมต่อ Google Drive</div>'+
        '<button class="btn btn-primary btn-sm" onclick="state.view=\'sources\';render()">🔌 Setup Data Source</button>';
    }
    if (datesList.length){
      emptyHtml += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--sub)">'+
        'มีข้อมูล '+datesList.length+' วัน — กระโดดไปดู:&nbsp; '+
        datesList.slice(0,7).map(function(d){return '<a onclick="setDate(\''+d+'\')" style="color:var(--brand);cursor:pointer;text-decoration:underline;margin-right:8px">'+esc(d)+'</a>';}).join('')+
        (datesList.length>7?' · +'+(datesList.length-7)+' more':'')+
      '</div>';
    }
    emptyHtml += '</div>';
    return header + (flights.length===0 ? emptyHtml :
      '<div class="sub" style="margin:0 0 10px 4px;font-size:12px">'+flights.length+' flights · sorted by departure time'+(state.driveLastSync?' · last sync '+esc(state.driveLastSync.replace('T',' ').slice(0,16)):'')+'</div>'+
      flights.map(function(f){return renderFlightCard(f);}).join(''));
  }

  if (mode === 'week'){
    // Get current week (Mon-Sun based on selected date)
    var dt = new Date(date), dow = dt.getDay() || 7;
    var monday = new Date(dt); monday.setDate(dt.getDate() - (dow-1));
    var weekDays = [];
    for (var i=0;i<7;i++){ var d=new Date(monday); d.setDate(monday.getDate()+i); weekDays.push(d); }
    var rows = '';
    weekDays.forEach(function(d){
      var iso = isoDate(d);
      var fl = state.flights.filter(function(f){return f.flight_date===iso && (team==='ALL'||f.team===team);}).sort(function(a,b){return pt(a.dep_time)-pt(b.dep_time);});
      var dn = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i];
      var dayName = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
      var isToday = iso === isoDate(new Date());
      // Compute coverage
      var totReq=0, totAsn=0;
      fl.forEach(function(f){var sop=getSOP(f.airline);totReq+=sop.total;var key=f.team+'-'+iso+'-'+f.id,fa=state.assignments[key]||{};Object.keys(fa).forEach(function(r){totAsn+=(fa[r]||[]).filter(function(x){return x;}).length;});});
      var pct = totReq?Math.round(totAsn/totReq*100):0;
      var pcls = pct>=95?'badge-green':pct>=70?'badge-amber':pct>0?'badge-red':'';
      rows += '<div style="border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;'+(isToday?'border-color:var(--brand);background:var(--brand-soft)':'')+'">'+

          '<div style="font-size:12px"><span style="color:var(--sub)">'+fl.length+' flights</span> · <span class="badge '+pcls+'">'+(totReq?totAsn+'/'+totReq+' ('+pct+'%)':'—')+'</span></div>'+
        '</div>'+
        (fl.length===0 ? '<div style="color:var(--sub);font-size:12px;padding:6px 0">No flights</div>' :
          '<div style="display:flex;flex-wrap:wrap;gap:4px">'+fl.map(function(f){

          }).join('')+'</div>')+
        '</div>';

  }

  if (mode === 'month'){
    var d = new Date(date), y = d.getFullYear(), m = d.getMonth();
    var days = new Date(y,m+1,0).getDate();
    var firstDow = new Date(y,m,1).getDay() || 7;
    var cells = '';
    // Empty cells for week alignment (assume Mon start: Mon=1..Sun=7)

    for (var dy=1;dy<=days;dy++){
      var iso = y+'-'+p2(m+1)+'-'+p2(dy);
      var fl = state.flights.filter(function(f){return f.flight_date===iso && (team==='ALL'||f.team===team);});
      var dotCount = fl.length;
      var cls = '';
      if (dotCount > 30) cls = 'm-hi'; else if (dotCount > 15) cls = 'm-mid'; else if (dotCount > 0) cls = 'm-lo';
      var isToday = iso === isoDate(new Date());
      var isSelected = iso === date;
      var isSun = new Date(y,m,dy).getDay()===0;
      cells += '<div class="m-cell '+cls+(isToday?' m-today':'')+(isSelected?' m-sel':'')+(isSun?' m-sun':'')+'" onclick="state.dailyView=\'day\';setDate(\''+iso+'\')">'+
        '<div class="m-d">'+dy+'</div>'+
        (dotCount?'<div class="m-c">'+dotCount+' flights</div>':'')+
      '</div>';
    }
    var monthLabel = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]+' '+y;
    return header +
      '<div style="font-size:13px;font-weight:700;margin:0 0 8px 4px">'+monthLabel+' · '+(team==='ALL'?'All teams':TEAM_LABELS[team])+'</div>'+
      '<div class="m-grid">'+
        ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(d){return '<div class="m-head">'+d+'</div>';}).join('')+
        cells+
      '</div>'+
      '<div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--sub)">'+
        '<span><span class="m-leg m-lo"></span>1–15 flights</span>'+
        '<span><span class="m-leg m-mid"></span>16–30 flights</span>'+
        '<span><span class="m-leg m-hi"></span>30+ flights</span>'+
        '<span style="margin-left:auto">💡 Click a day to view its flight cards</span>'+
      '</div>';
  }
